<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
		/>
		<title>02 — Neon Cyberpunk</title>
		<link
			href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=JetBrains+Mono:wght@300;400&display=swap"
			rel="stylesheet"
		/>
		<style>
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}
			:root {
				--bg: #000;
				--surface: #0a0a0e;
				--card: #0f0f16;
				--text: #e0e0f0;
				--muted: #555;
				--cyan: #00f0ff;
				--magenta: #ff00ff;
				--radius: 4px;
			}
			body {
				font-family: 'JetBrains Mono', monospace;
				background: var(--bg);
				color: var(--text);
				min-height: 100vh;
				position: relative;
			}
			body::before {
				content: '';
				position: fixed;
				inset: 0;
				background: repeating-linear-gradient(
					0deg,
					transparent,
					transparent 2px,
					rgba(0, 240, 255, 0.02) 2px,
					rgba(0, 240, 255, 0.02) 4px
				);
				pointer-events: none;
			}
			.header {
				display: flex;
				justify-content: space-between;
				align-items: center;
				padding: 20px 20px 0;
				border-bottom: 1px solid rgba(0, 240, 255, 0.1);
				padding-bottom: 14px;
				margin: 0 20px;
			}
			.header h1 {
				font-family: 'Orbitron', sans-serif;
				font-size: 14px;
				font-weight: 700;
				text-transform: uppercase;
				letter-spacing: 4px;
				color: var(--cyan);
				text-shadow: 0 0 10px rgba(0, 240, 255, 0.3);
			}
			.header button {
				width: 36px;
				height: 36px;
				border: 2px solid var(--magenta);
				background: transparent;
				color: var(--magenta);
				font-size: 18px;
				cursor: pointer;
				font-family: inherit;
				box-shadow: 0 0 8px rgba(255, 0, 255, 0.2);
				transition: all 0.15s;
			}
			.header button:active {
				background: rgba(255, 0, 255, 0.1);
			}
			.focus-sec {
				padding: 20px;
				margin: 16px;
				background: var(--surface);
				border: 1px solid rgba(0, 240, 255, 0.15);
				position: relative;
			}
			.focus-sec::after {
				content: '';
				position: absolute;
				bottom: -1px;
				left: 0;
				right: 0;
				height: 1px;
				background: linear-gradient(90deg, transparent, var(--magenta), var(--cyan), transparent);
				opacity: 0.5;
			}
			.focus-label {
				font-family: 'Orbitron', sans-serif;
				font-size: 10px;
				font-weight: 700;
				text-transform: uppercase;
				letter-spacing: 3px;
				color: var(--magenta);
				margin-bottom: 14px;
				text-shadow: 0 0 8px rgba(255, 0, 255, 0.3);
			}
			.focus-row {
				display: flex;
				gap: 16px;
			}
			.focus-row .cover {
				width: 90px;
				height: 126px;
				border-radius: var(--radius);
				object-fit: cover;
				flex-shrink: 0;
				border: 1px solid var(--cyan);
				box-shadow: 0 0 12px rgba(0, 240, 255, 0.15);
			}
			.focus-row .info {
				flex: 1;
			}
			.focus-row .info .t {
				font-family: 'Orbitron', sans-serif;
				font-size: 14px;
				font-weight: 700;
				text-transform: uppercase;
				letter-spacing: 1.5px;
				color: var(--cyan);
				text-shadow: 0 0 8px rgba(0, 240, 255, 0.2);
			}
			.focus-row .info .a {
				font-size: 10px;
				color: var(--muted);
				margin-top: 2px;
				letter-spacing: 1px;
			}
			.focus-row .info .q {
				font-size: 10px;
				color: var(--muted);
				margin-top: 6px;
				font-style: italic;
				line-height: 1.4;
				padding-left: 8px;
				border-left: 2px solid var(--magenta);
				opacity: 0.7;
			}
			.focus-prog {
				margin-top: 14px;
			}
			.focus-prog .row1 {
				display: flex;
				justify-content: space-between;
				font-size: 10px;
				color: var(--muted);
				letter-spacing: 0.5px;
			}
			.focus-prog .row1 strong {
				color: var(--cyan);
			}
			.focus-prog .track {
				margin-top: 6px;
				height: 3px;
				background: rgba(255, 255, 255, 0.03);
				border-radius: 2px;
				overflow: hidden;
			}
			.focus-prog .track .fill {
				height: 100%;
				width: 72%;
				background: linear-gradient(90deg, var(--magenta), var(--cyan));
				border-radius: 2px;
				box-shadow: 0 0 6px rgba(0, 240, 255, 0.3);
			}
			.focus-btn {
				margin-top: 12px;
				padding: 10px 0;
				width: 100%;
				border: 2px solid var(--cyan);
				background: transparent;
				color: var(--cyan);
				font-size: 11px;
				font-weight: 700;
				cursor: pointer;
				font-family: 'Orbitron', sans-serif;
				text-transform: uppercase;
				letter-spacing: 2px;
				transition: all 0.15s;
			}
			.focus-btn:active {
				background: rgba(0, 240, 255, 0.08);
			}
			.rest-hdr {
				padding: 0 20px;
				margin-bottom: 12px;
				display: flex;
				justify-content: space-between;
				align-items: center;
			}
			.rest-hdr h2 {
				font-family: 'Orbitron', sans-serif;
				font-size: 11px;
				font-weight: 400;
				text-transform: uppercase;
				letter-spacing: 2px;
				color: var(--muted);
			}
			.rest-hdr h2 span {
				color: var(--cyan);
			}
			.rest-hdr .sort {
				font-size: 10px;
				color: var(--magenta);
				cursor: pointer;
			}
			.grid {
				display: grid;
				grid-template-columns: repeat(4, 1fr);
				gap: 8px;
				padding: 0 20px 40px;
			}
			.item {
				text-align: center;
			}
			.item img {
				width: 100%;
				aspect-ratio: 3/4;
				object-fit: cover;
				border-radius: var(--radius);
				border: 1px solid rgba(0, 240, 255, 0.08);
				transition: all 0.15s;
			}
			.item:active img {
				transform: scale(0.93);
				border-color: var(--magenta);
				box-shadow: 0 0 12px rgba(255, 0, 255, 0.2);
			}
			.item .t {
				font-size: 9px;
				margin-top: 4px;
				overflow: hidden;
				text-overflow: ellipsis;
				white-space: nowrap;
				color: var(--muted);
				letter-spacing: 0.5px;
			}
			.item .pct {
				display: inline-flex;
				margin-top: 3px;
				width: 20px;
				height: 20px;
				border-radius: 50%;
				border: 1px solid rgba(0, 240, 255, 0.15);
				font-size: 8px;
				align-items: center;
				justify-content: center;
				color: var(--cyan);
				background: rgba(0, 240, 255, 0.03);
			}
		</style>
	</head>
	<body>
		<div class="header">
			<h1>Library</h1>
			<button>+</button>
		</div>
		<div class="focus-sec">
			<div class="focus-label">Reading Session</div>
			<div class="focus-row">
				<img class="cover" src="https://picsum.photos/seed/gatsby/300/420" alt="" loading="lazy" />
				<div class="info">
					<div class="t">The Great Gatsby</div>
					<div class="a">F. Scott Fitzgerald</div>
					<div class="q">"So we beat on, boats against the current..."</div>
				</div>
			</div>
			<div class="focus-prog">
				<div class="row1">
					<span>CH.07/09</span><span><strong>72%</strong> SYNC</span>
				</div>
				<div class="track"><div class="fill"></div></div>
			</div>
			<button class="focus-btn">Resume</button>
		</div>
		<div class="rest-hdr">
			<h2>Index <span>· 8</span></h2>
			<span class="sort">SORT</span>
		</div>
		<div class="grid" id="g"></div>
		<script>
			const b = [
				{ t: '1984', a: 'George Orwell', s: '1984', p: 34 },
				{ t: 'Pride & Prejudice', a: 'Jane Austen', s: 'pride', p: 91 },
				{ t: 'The Hobbit', a: 'J.R.R. Tolkien', s: 'hobbit', p: 15 },
				{ t: 'Dune', a: 'Frank Herbert', s: 'dune', p: 58 },
				{ t: 'Neuromancer', a: 'W. Gibson', s: 'neuromancer', p: 7 },
				{ t: 'Brave New World', a: 'A. Huxley', s: 'brave', p: 44 },
				{ t: 'Fahrenheit 451', a: 'R. Bradbury', s: 'fahrenheit', p: 100 },
				{ t: 'Catcher in the Rye', a: 'J.D. Salinger', s: 'catcher', p: 23 }
			];
			document.getElementById('g').innerHTML = b
				.map(
					(x) =>
						`<div class="item"><img src="https://picsum.photos/seed/${x.s}/200/280" alt="${x.t}" loading="lazy"><div class="t">${x.t}</div><span class="pct">${x.p}%</span></div>`
				)
				.join('');
		</script>
	</body>
</html>
