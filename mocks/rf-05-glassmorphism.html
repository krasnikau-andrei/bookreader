<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
		/>
		<title>05 — Glassmorphism</title>
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap"
			rel="stylesheet"
		/>
		<style>
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}
			:root {
				--bg: #0d0d1a;
				--text: rgba(255, 255, 255, 0.85);
				--muted: rgba(255, 255, 255, 0.35);
				--accent: rgba(255, 255, 255, 0.15);
				--radius: 20px;
			}
			body {
				font-family: 'Inter', sans-serif;
				min-height: 100vh;
				background: var(--bg);
				color: var(--text);
				position: relative;
			}
			body::before {
				content: '';
				position: fixed;
				inset: 0;
				background:
					radial-gradient(ellipse at 80% 20%, rgba(120, 80, 200, 0.12) 0%, transparent 50%),
					radial-gradient(ellipse at 20% 80%, rgba(0, 180, 200, 0.08) 0%, transparent 50%);
				pointer-events: none;
			}
			.header {
				display: flex;
				justify-content: space-between;
				align-items: center;
				padding: 24px 20px 0;
			}
			.header h1 {
				font-size: 20px;
				font-weight: 500;
				letter-spacing: -0.3px;
				text-shadow: 0 2px 20px rgba(255, 255, 255, 0.03);
			}
			.header button {
				width: 40px;
				height: 40px;
				border-radius: 14px;
				border: 1px solid rgba(255, 255, 255, 0.1);
				background: rgba(255, 255, 255, 0.04);
				backdrop-filter: blur(20px);
				-webkit-backdrop-filter: blur(20px);
				color: rgba(255, 255, 255, 0.6);
				font-size: 18px;
				cursor: pointer;
				box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
				transition: all 0.15s;
			}
			.header button:active {
				background: rgba(255, 255, 255, 0.08);
			}
			.focus-sec {
				margin: 16px 20px;
				padding: 24px;
				border-radius: var(--radius);
				background: rgba(255, 255, 255, 0.04);
				backdrop-filter: blur(24px);
				-webkit-backdrop-filter: blur(24px);
				border: 1px solid rgba(255, 255, 255, 0.06);
				box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
			}
			.focus-label {
				font-size: 11px;
				font-weight: 500;
				text-transform: uppercase;
				letter-spacing: 2px;
				color: rgba(255, 255, 255, 0.3);
				margin-bottom: 14px;
			}
			.focus-row {
				display: flex;
				gap: 18px;
			}
			.focus-row .cover {
				width: 90px;
				height: 126px;
				border-radius: 12px;
				object-fit: cover;
				flex-shrink: 0;
				box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
			}
			.focus-row .info {
				flex: 1;
			}
			.focus-row .info .t {
				font-size: 19px;
				font-weight: 600;
				letter-spacing: -0.3px;
			}
			.focus-row .info .a {
				font-size: 12px;
				color: rgba(255, 255, 255, 0.3);
				margin-top: 2px;
			}
			.focus-row .info .q {
				font-size: 11px;
				color: rgba(255, 255, 255, 0.25);
				margin-top: 6px;
				line-height: 1.5;
				padding-left: 10px;
				border-left: 2px solid rgba(255, 255, 255, 0.06);
			}
			.focus-prog {
				margin-top: 16px;
			}
			.focus-prog .row1 {
				display: flex;
				justify-content: space-between;
				font-size: 11px;
				color: rgba(255, 255, 255, 0.3);
			}
			.focus-prog .row1 strong {
				color: rgba(255, 255, 255, 0.7);
			}
			.focus-prog .track {
				margin-top: 6px;
				height: 3px;
				background: rgba(255, 255, 255, 0.04);
				border-radius: 2px;
				overflow: hidden;
			}
			.focus-prog .track .fill {
				height: 100%;
				width: 72%;
				background: rgba(255, 255, 255, 0.15);
				border-radius: 2px;
			}
			.focus-btn {
				margin-top: 14px;
				padding: 11px 0;
				width: 100%;
				border: 1px solid rgba(255, 255, 255, 0.06);
				border-radius: 12px;
				background: rgba(255, 255, 255, 0.03);
				backdrop-filter: blur(10px);
				color: rgba(255, 255, 255, 0.6);
				font-size: 12px;
				font-weight: 500;
				cursor: pointer;
				font-family: inherit;
				transition: all 0.15s;
			}
			.focus-btn:active {
				background: rgba(255, 255, 255, 0.06);
			}
			.rest-hdr {
				padding: 0 20px;
				margin-bottom: 14px;
				display: flex;
				justify-content: space-between;
				align-items: center;
			}
			.rest-hdr h2 {
				font-size: 14px;
				font-weight: 500;
			}
			.rest-hdr h2 span {
				color: rgba(255, 255, 255, 0.25);
				font-weight: 400;
			}
			.rest-hdr .sort {
				font-size: 11px;
				color: rgba(255, 255, 255, 0.3);
			}
			.grid {
				display: grid;
				grid-template-columns: repeat(4, 1fr);
				gap: 10px;
				padding: 0 20px 40px;
			}
			.item {
				text-align: center;
			}
			.item img {
				width: 100%;
				aspect-ratio: 3/4;
				object-fit: cover;
				border-radius: 10px;
				box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
				transition: transform 0.15s;
			}
			.item:active img {
				transform: scale(0.93);
			}
			.item .t {
				font-size: 10px;
				margin-top: 5px;
				overflow: hidden;
				text-overflow: ellipsis;
				white-space: nowrap;
				color: rgba(255, 255, 255, 0.3);
			}
			.item .pct {
				display: inline-flex;
				margin-top: 3px;
				width: 20px;
				height: 20px;
				border-radius: 50%;
				background: rgba(255, 255, 255, 0.03);
				border: 1px solid rgba(255, 255, 255, 0.04);
				font-size: 8px;
				align-items: center;
				justify-content: center;
				color: rgba(255, 255, 255, 0.3);
			}
		</style>
	</head>
	<body>
		<div class="header">
			<h1>Library</h1>
			<button>+</button>
		</div>
		<div class="focus-sec">
			<div class="focus-label">Currently Reading</div>
			<div class="focus-row">
				<img class="cover" src="https://picsum.photos/seed/gatsby/300/420" alt="" loading="lazy" />
				<div class="info">
					<div class="t">The Great Gatsby</div>
					<div class="a">F. Scott Fitzgerald</div>
					<div class="q">"So we beat on, boats against the current..."</div>
				</div>
			</div>
			<div class="focus-prog">
				<div class="row1">
					<span>Chapter 7 of 9</span><span><strong>72%</strong> complete</span>
				</div>
				<div class="track"><div class="fill"></div></div>
			</div>
			<button class="focus-btn">Resume Reading</button>
		</div>
		<div class="rest-hdr">
			<h2>All Books <span>· 8 more</span></h2>
			<span class="sort">Sort</span>
		</div>
		<div class="grid" id="g"></div>
		<script>
			const b = [
				{ t: '1984', a: 'George Orwell', s: '1984', p: 34 },
				{ t: 'Pride & Prejudice', a: 'Jane Austen', s: 'pride', p: 91 },
				{ t: 'The Hobbit', a: 'J.R.R. Tolkien', s: 'hobbit', p: 15 },
				{ t: 'Dune', a: 'Frank Herbert', s: 'dune', p: 58 },
				{ t: 'Neuromancer', a: 'W. Gibson', s: 'neuromancer', p: 7 },
				{ t: 'Brave New World', a: 'A. Huxley', s: 'brave', p: 44 },
				{ t: 'Fahrenheit 451', a: 'R. Bradbury', s: 'fahrenheit', p: 100 },
				{ t: 'Catcher in the Rye', a: 'J.D. Salinger', s: 'catcher', p: 23 }
			];
			document.getElementById('g').innerHTML = b
				.map(
					(x) =>
						`<div class="item"><img src="https://picsum.photos/seed/${x.s}/200/280" alt="${x.t}" loading="lazy"><div class="t">${x.t}</div><span class="pct">${x.p}%</span></div>`
				)
				.join('');
		</script>
	</body>
</html>
