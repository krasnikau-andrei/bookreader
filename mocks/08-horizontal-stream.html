<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
		/>
		<title>Mock 8 — Horizontal Stream</title>
		<link
			href="https://fonts.googleapis.com/css2?family=Epilogue:wght@300;500;600;700&display=swap"
			rel="stylesheet"
		/>
		<style>
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}
			:root {
				--purple: #a855f7;
				--purple-dim: rgba(168, 85, 247, 0.1);
				--warm: #120e14;
				--surface: #1a1520;
				--card: #221c2a;
				--text: #e0d8e8;
				--muted: #6a5a7a;
			}
			body {
				font-family: 'Epilogue', sans-serif;
				background: var(--warm);
				color: var(--text);
				min-height: 100vh;
				padding: 20px 0;
			}
			body::before {
				content: '';
				position: fixed;
				inset: 0;
				background: radial-gradient(
					ellipse at 50% 0%,
					rgba(168, 85, 247, 0.04) 0%,
					transparent 60%
				);
				pointer-events: none;
			}
			.top {
				display: flex;
				justify-content: space-between;
				align-items: center;
				padding: 0 20px;
				margin-bottom: 20px;
			}
			.top h1 {
				font-size: 24px;
				font-weight: 700;
				letter-spacing: -0.5px;
			}
			.top .actions {
				display: flex;
				gap: 8px;
			}
			.top .actions button {
				width: 40px;
				height: 40px;
				border-radius: 10px;
				border: none;
				background: var(--surface);
				color: var(--muted);
				font-size: 18px;
				cursor: pointer;
				transition: all 0.15s;
			}
			.top .actions button:active {
				background: var(--purple-dim);
				color: var(--purple);
			}
			.hero-card {
				margin: 0 20px 28px;
				border-radius: 18px;
				overflow: hidden;
				position: relative;
			}
			.hero-card img {
				width: 100%;
				aspect-ratio: 16/9;
				object-fit: cover;
				display: block;
			}
			.hero-card .grad {
				position: absolute;
				inset: 0;
				background: linear-gradient(
					90deg,
					rgba(18, 14, 20, 0.95) 0%,
					transparent 50%,
					rgba(18, 14, 20, 0.6) 100%
				);
				display: flex;
				flex-direction: column;
				justify-content: flex-end;
				padding: 20px;
			}
			.hero-card .grad .tag {
				font-size: 10px;
				font-weight: 600;
				text-transform: uppercase;
				letter-spacing: 2px;
				color: var(--purple);
			}
			.hero-card .grad h2 {
				font-size: 24px;
				font-weight: 700;
				margin-top: 4px;
				letter-spacing: -0.3px;
			}
			.hero-card .grad .by {
				font-size: 13px;
				color: var(--muted);
				font-weight: 300;
			}
			.hero-card .grad .meta-row {
				display: flex;
				align-items: center;
				gap: 12px;
				margin-top: 10px;
			}
			.hero-card .grad .meta-row .play-btn {
				padding: 8px 20px;
				border: none;
				border-radius: 24px;
				background: var(--purple);
				color: #fff;
				font-size: 12px;
				font-weight: 600;
				cursor: pointer;
				font-family: inherit;
				display: flex;
				align-items: center;
				gap: 6px;
			}
			.hero-card .grad .meta-row .pct {
				font-size: 12px;
				color: var(--muted);
			}
			.hero-card .grad .meta-row .pct strong {
				color: var(--purple);
			}
			.stream-section {
				margin-bottom: 24px;
			}
			.stream-header {
				display: flex;
				justify-content: space-between;
				align-items: center;
				padding: 0 20px;
				margin-bottom: 10px;
			}
			.stream-header h3 {
				font-size: 14px;
				font-weight: 600;
			}
			.stream-header h3 span {
				color: var(--muted);
				font-weight: 300;
			}
			.stream {
				display: flex;
				gap: 12px;
				padding: 0 20px;
				overflow-x: auto;
				scroll-snap-type: x mandatory;
				-webkit-overflow-scrolling: touch;
				scrollbar-width: none;
			}
			.stream::-webkit-scrollbar {
				display: none;
			}
			.stream-item {
				flex: 0 0 260px;
				scroll-snap-align: start;
				background: var(--card);
				border-radius: 14px;
				overflow: hidden;
				border: 1px solid rgba(255, 255, 255, 0.02);
				transition: all 0.15s;
			}
			.stream-item:active {
				transform: scale(0.97);
				border-color: var(--purple-dim);
			}
			.stream-item .row {
				display: flex;
				gap: 10px;
				padding: 10px;
			}
			.stream-item .row img {
				width: 70px;
				height: 98px;
				object-fit: cover;
				border-radius: 6px;
				flex-shrink: 0;
			}
			.stream-item .row .meta {
				flex: 1;
				min-width: 0;
				display: flex;
				flex-direction: column;
				justify-content: center;
			}
			.stream-item .row .meta .t {
				font-size: 13px;
				font-weight: 600;
				line-height: 1.2;
			}
			.stream-item .row .meta .a {
				font-size: 11px;
				color: var(--muted);
				margin-top: 2px;
				font-weight: 300;
			}
			.stream-item .row .meta .pct-row {
				display: flex;
				align-items: center;
				gap: 6px;
				margin-top: 8px;
			}
			.stream-item .row .meta .pct-row .track {
				flex: 1;
				height: 3px;
				background: rgba(255, 255, 255, 0.04);
				border-radius: 2px;
				overflow: hidden;
			}
			.stream-item .row .meta .pct-row .track .fill {
				height: 100%;
				background: var(--purple);
			}
			.stream-item .row .meta .pct-row .num {
				font-size: 11px;
				font-weight: 600;
				color: var(--purple);
			}
			.mini-row {
				display: flex;
				gap: 8px;
				padding: 0 20px;
				overflow-x: auto;
				scrollbar-width: none;
				margin-top: 10px;
			}
			.mini-row::-webkit-scrollbar {
				display: none;
			}
			.mini-row .pill {
				flex: 0 0 auto;
				padding: 6px 16px;
				border-radius: 20px;
				background: var(--surface);
				border: 1px solid rgba(255, 255, 255, 0.02);
				font-size: 11px;
				font-weight: 500;
				color: var(--muted);
				white-space: nowrap;
				cursor: pointer;
				font-family: inherit;
			}
			.mini-row .pill:active {
				background: var(--purple-dim);
				color: var(--purple);
			}
		</style>
	</head>
	<body>
		<div class="top">
			<h1>Stream</h1>
			<div class="actions">
				<button>🔍</button>
				<button>+</button>
			</div>
		</div>

		<div class="mini-row">
			<span class="pill" style="background: var(--purple-dim); color: var(--purple)">All</span>
			<span class="pill">Fiction</span>
			<span class="pill">Sci-Fi</span>
			<span class="pill">Classics</span>
			<span class="pill">In Progress</span>
		</div>

		<div class="hero-card" id="hero-stream"></div>

		<div class="stream-section">
			<div class="stream-header">
				<h3>Continue <span>Reading</span></h3>
				<span style="color: var(--muted); font-size: 12px">→</span>
			</div>
			<div class="stream" id="stream-continue"></div>
		</div>

		<div class="stream-section">
			<div class="stream-header">
				<h3>You Might <span>Like</span></h3>
				<span style="color: var(--muted); font-size: 12px">→</span>
			</div>
			<div class="stream" id="stream-suggest"></div>
		</div>

		<div class="stream-section">
			<div class="stream-header">
				<h3>Recently <span>Added</span></h3>
				<span style="color: var(--muted); font-size: 12px">→</span>
			</div>
			<div class="stream" id="stream-recent"></div>
		</div>

		<script>
			const books = [
				{
					title: 'The Great Gatsby',
					author: 'F. Scott Fitzgerald',
					seed: 'gatsby',
					pct: 72,
					tag: 'Staff Pick'
				},
				{ title: '1984', author: 'George Orwell', seed: '1984', pct: 34 },
				{ title: 'Pride and Prejudice', author: 'Jane Austen', seed: 'pride', pct: 91 },
				{ title: 'The Hobbit', author: 'J.R.R. Tolkien', seed: 'hobbit', pct: 15 },
				{ title: 'Dune', author: 'Frank Herbert', seed: 'dune', pct: 58, tag: 'Staff Pick' },
				{ title: 'Neuromancer', author: 'William Gibson', seed: 'neuromancer', pct: 7 },
				{ title: 'Brave New World', author: 'Aldous Huxley', seed: 'brave', pct: 44 },
				{ title: 'Fahrenheit 451', author: 'Ray Bradbury', seed: 'fahrenheit', pct: 100 },
				{ title: 'The Catcher in the Rye', author: 'J.D. Salinger', seed: 'catcher', pct: 23 }
			];

			document.getElementById('hero-stream').innerHTML = `
      <img src="https://picsum.photos/seed/stream-hero/800/450" alt="" loading="lazy">
      <div class="grad">
        <div class="tag">Featured</div>
        <h2>Dune</h2>
        <div class="by">Frank Herbert</div>
        <div class="meta-row">
          <button class="play-btn">▶ Continue</button>
          <span class="pct"><strong>58%</strong> complete</span>
        </div>
      </div>
    `;

			function renderStream(books, elId) {
				document.getElementById(elId).innerHTML = books
					.map(
						(b) => `
        <div class="stream-item">
          <div class="row">
            <img src="https://picsum.photos/seed/${b.seed}/300/420" alt="${b.title}" loading="lazy">
            <div class="meta">
              <div class="t">${b.title}</div>
              <div class="a">${b.author}</div>
              <div class="pct-row">
                <div class="track"><div class="fill" style="width:${b.pct}%"></div></div>
                <span class="num">${b.pct}%</span>
              </div>
            </div>
          </div>
        </div>
      `
					)
					.join('');
			}

			renderStream(books.slice(0, 4), 'stream-continue');
			renderStream(books.slice(4), 'stream-suggest');
			renderStream([...books].reverse(), 'stream-recent');
		</script>
	</body>
</html>
