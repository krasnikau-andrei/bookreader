<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
		/>
		<title>Mock 3 — Magazine Editorial</title>
		<link
			href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@400;500;600&display=swap"
			rel="stylesheet"
		/>
		<style>
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}
			:root {
				--gold: #c9a84c;
				--gold-dim: rgba(201, 168, 76, 0.08);
				--bg: #0f0d0a;
				--surface: #181512;
				--card: #201c16;
				--text: #e2dad0;
				--muted: #7a6f60;
			}
			body {
				font-family: 'DM Sans', sans-serif;
				background: var(--bg);
				color: var(--text);
				min-height: 100vh;
				padding: 0;
			}
			body::before {
				content: '';
				position: fixed;
				inset: 0;
				background: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
				pointer-events: none;
			}
			.header {
				padding: 20px 20px 0;
				display: flex;
				justify-content: space-between;
				align-items: center;
			}
			.header h1 {
				font-family: 'Playfair Display', serif;
				font-size: 28px;
				font-weight: 400;
				color: var(--gold);
				letter-spacing: -0.5px;
			}
			.header button {
				width: 40px;
				height: 40px;
				border-radius: 50%;
				border: 1px solid var(--gold-dim);
				background: transparent;
				color: var(--gold);
				font-size: 18px;
				cursor: pointer;
			}
			.magazine-line {
				height: 1px;
				background: linear-gradient(90deg, var(--gold-dim), transparent);
				margin: 12px 20px 20px;
			}
			.featured {
				margin: 0 20px 32px;
				display: flex;
				flex-direction: column;
				gap: 16px;
			}
			.featured-cover {
				width: 100%;
				border-radius: 4px;
				overflow: hidden;
				position: relative;
				box-shadow: 0 8px 40px rgba(0, 0, 0, 0.5);
			}
			.featured-cover img {
				width: 100%;
				aspect-ratio: 4/3;
				object-fit: cover;
				display: block;
			}
			.featured-cover .issue-tag {
				position: absolute;
				top: 12px;
				left: 12px;
				font-size: 10px;
				font-weight: 600;
				text-transform: uppercase;
				letter-spacing: 2px;
				color: var(--gold);
				background: rgba(15, 13, 10, 0.8);
				padding: 4px 10px;
			}
			.featured-text {
				padding: 0;
			}
			.featured-text .overline {
				font-size: 10px;
				font-weight: 600;
				text-transform: uppercase;
				letter-spacing: 3px;
				color: var(--gold);
				margin-bottom: 6px;
			}
			.featured-text h2 {
				font-family: 'Playfair Display', serif;
				font-size: 28px;
				font-weight: 700;
				line-height: 1.15;
				color: #f0e8dc;
			}
			.featured-text .byline {
				font-size: 13px;
				color: var(--muted);
				margin-top: 4px;
				font-style: italic;
			}
			.featured-text .excerpt {
				font-size: 13px;
				color: var(--muted);
				margin-top: 8px;
				line-height: 1.5;
			}
			.featured-text .progress-sec {
				display: flex;
				align-items: center;
				gap: 10px;
				margin-top: 14px;
			}
			.featured-text .progress-sec .track {
				flex: 1;
				height: 3px;
				background: rgba(255, 255, 255, 0.06);
				border-radius: 2px;
				overflow: hidden;
			}
			.featured-text .progress-sec .track .fill {
				height: 100%;
				width: 60%;
				background: var(--gold);
			}
			.featured-text .progress-sec .pct {
				font-size: 13px;
				font-weight: 600;
				color: var(--gold);
			}
			.divider {
				height: 1px;
				background: var(--card);
				margin: 0 20px 24px;
			}
			.section-title {
				font-family: 'Playfair Display', serif;
				font-size: 18px;
				font-weight: 400;
				font-style: italic;
				color: var(--gold);
				padding: 0 20px;
				margin-bottom: 16px;
			}
			.grid-2 {
				display: grid;
				grid-template-columns: 1fr 1fr;
				gap: 12px;
				padding: 0 20px;
			}
			.grid-item {
				background: var(--card);
				border: 1px solid rgba(255, 255, 255, 0.02);
			}
			.grid-item img {
				width: 100%;
				aspect-ratio: 3/4;
				object-fit: cover;
				display: block;
			}
			.grid-item .body {
				padding: 10px 8px 12px;
			}
			.grid-item .body h3 {
				font-size: 12px;
				font-weight: 600;
				line-height: 1.3;
			}
			.grid-item .body .author {
				font-size: 10px;
				color: var(--muted);
				margin-top: 2px;
			}
			.grid-item .body .stat {
				font-size: 10px;
				font-weight: 600;
				color: var(--gold);
				margin-top: 4px;
			}
			.shelf {
				margin: 28px 20px 0;
				padding: 16px 0;
				border-top: 1px solid var(--card);
			}
			.shelf h3 {
				font-family: 'Playfair Display', serif;
				font-size: 14px;
				font-weight: 400;
				font-style: italic;
				color: var(--muted);
				margin-bottom: 12px;
			}
			.shelf-scroll {
				display: flex;
				gap: 10px;
				overflow-x: auto;
				scrollbar-width: none;
				padding-bottom: 4px;
			}
			.shelf-scroll::-webkit-scrollbar {
				display: none;
			}
			.shelf-scroll .mini {
				flex: 0 0 70px;
				text-align: center;
			}
			.shelf-scroll .mini img {
				width: 100%;
				aspect-ratio: 3/4;
				border-radius: 4px;
				object-fit: cover;
			}
			.shelf-scroll .mini .label {
				font-size: 9px;
				color: var(--muted);
				margin-top: 4px;
				overflow: hidden;
				text-overflow: ellipsis;
				white-space: nowrap;
			}
		</style>
	</head>
	<body>
		<div class="header">
			<h1>Bibliotheca</h1>
			<button>+</button>
		</div>
		<div class="magazine-line"></div>

		<div class="featured">
			<div class="featured-cover">
				<img src="https://picsum.photos/seed/featured-novel/800/600" alt="" loading="lazy" />
				<span class="issue-tag">Vol. IV — Staff Pick</span>
			</div>
			<div class="featured-text">
				<div class="overline">Featured Edition</div>
				<h2>The Great Gatsby</h2>
				<div class="byline">F. Scott Fitzgerald</div>
				<div class="excerpt">
					"So we beat on, boats against the current, borne back ceaselessly into the past."
				</div>
				<div class="progress-sec">
					<div class="track"><div class="fill"></div></div>
					<span class="pct">60%</span>
				</div>
			</div>
		</div>

		<div class="divider"></div>
		<div class="section-title">From the Shelves</div>
		<div class="grid-2" id="featured-grid"></div>

		<div class="shelf">
			<h3>Continue Reading</h3>
			<div class="shelf-scroll" id="shelf-scroll"></div>
		</div>

		<script>
			const books = [
				{ title: '1984', author: 'George Orwell', seed: '1984', pct: 34 },
				{ title: 'Pride and Prejudice', author: 'Jane Austen', seed: 'pride', pct: 91 },
				{ title: 'The Hobbit', author: 'J.R.R. Tolkien', seed: 'hobbit', pct: 15 },
				{ title: 'Dune', author: 'Frank Herbert', seed: 'dune', pct: 58 },
				{ title: 'Neuromancer', author: 'William Gibson', seed: 'neuromancer', pct: 7 },
				{ title: 'Brave New World', author: 'Aldous Huxley', seed: 'brave', pct: 44 },
				{ title: 'Fahrenheit 451', author: 'Ray Bradbury', seed: 'fahrenheit', pct: 100 },
				{ title: 'The Catcher in the Rye', author: 'J.D. Salinger', seed: 'catcher', pct: 23 }
			];

			document.getElementById('featured-grid').innerHTML = books
				.slice(0, 4)
				.map(
					(b) => `
      <div class="grid-item">
        <img src="https://picsum.photos/seed/${b.seed}/300/420" alt="${b.title}" loading="lazy">
        <div class="body">
          <h3>${b.title}</h3>
          <div class="author">${b.author}</div>
          <div class="stat">${b.pct}% complete</div>
        </div>
      </div>
    `
				)
				.join('');

			document.getElementById('shelf-scroll').innerHTML = books
				.slice(4)
				.map(
					(b) => `
      <div class="mini">
        <img src="https://picsum.photos/seed/${b.seed}/200/280" alt="${b.title}" loading="lazy">
        <div class="label">${b.title}</div>
      </div>
    `
				)
				.join('');
		</script>
	</body>
</html>
