<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
		/>
		<title>03 — Warm Cosy</title>
		<link
			href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=DM+Sans:wght@400;500&display=swap"
			rel="stylesheet"
		/>
		<style>
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}
			:root {
				--bg: #1a1513;
				--surface: #221c18;
				--card: #2a2220;
				--text: #d4c9bc;
				--muted: #7a6a5a;
				--accent: #c4a882;
				--accent-dim: rgba(196, 168, 130, 0.06);
				--radius: 12px;
			}
			body {
				font-family: 'DM Sans', sans-serif;
				background: var(--bg);
				color: var(--text);
				min-height: 100vh;
			}
			body::before {
				content: '';
				position: fixed;
				inset: 0;
				background: radial-gradient(
					ellipse at 50% 30%,
					rgba(196, 168, 130, 0.03) 0%,
					transparent 60%
				);
				pointer-events: none;
			}
			.header {
				display: flex;
				justify-content: space-between;
				align-items: center;
				padding: 24px 24px 0;
			}
			.header h1 {
				font-family: 'Playfair Display', serif;
				font-size: 22px;
				font-weight: 400;
				color: var(--accent);
				letter-spacing: -0.5px;
			}
			.header button {
				width: 38px;
				height: 38px;
				border-radius: 50%;
				border: 1px solid #3a2f28;
				background: var(--surface);
				color: var(--accent);
				font-size: 18px;
				cursor: pointer;
				box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
				transition: all 0.2s;
			}
			.header button:active {
				background: #2f2823;
				border-color: var(--accent);
			}
			.focus-sec {
				padding: 24px;
				margin: 20px 24px;
				border-radius: var(--radius);
				background: var(--surface);
				box-shadow:
					0 4px 20px rgba(0, 0, 0, 0.3),
					inset 0 1px 0 rgba(255, 255, 255, 0.02);
			}
			.focus-label {
				font-family: 'Playfair Display', serif;
				font-size: 13px;
				font-style: italic;
				color: var(--accent);
				margin-bottom: 14px;
			}
			.focus-row {
				display: flex;
				gap: 18px;
			}
			.focus-row .cover {
				width: 95px;
				height: 133px;
				border-radius: 8px;
				object-fit: cover;
				flex-shrink: 0;
				box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
			}
			.focus-row .info {
				flex: 1;
			}
			.focus-row .info .t {
				font-family: 'Playfair Display', serif;
				font-size: 20px;
				font-weight: 600;
				line-height: 1.15;
			}
			.focus-row .info .a {
				font-size: 12px;
				color: var(--muted);
				margin-top: 2px;
				font-style: italic;
			}
			.focus-row .info .q {
				font-size: 11px;
				color: var(--muted);
				margin-top: 6px;
				font-style: italic;
				line-height: 1.5;
				padding-left: 10px;
				border-left: 2px solid var(--accent-dim);
			}
			.focus-prog {
				margin-top: 16px;
			}
			.focus-prog .row1 {
				display: flex;
				justify-content: space-between;
				font-size: 11px;
				color: var(--muted);
			}
			.focus-prog .row1 strong {
				color: var(--accent);
			}
			.focus-prog .track {
				margin-top: 6px;
				height: 4px;
				background: rgba(255, 255, 255, 0.03);
				border-radius: 2px;
				overflow: hidden;
			}
			.focus-prog .track .fill {
				height: 100%;
				width: 72%;
				background: var(--accent);
				border-radius: 2px;
			}
			.focus-btn {
				margin-top: 14px;
				padding: 11px 0;
				width: 100%;
				border: none;
				border-radius: var(--radius);
				background: rgba(196, 168, 130, 0.08);
				color: var(--accent);
				font-size: 13px;
				font-weight: 500;
				cursor: pointer;
				font-family: inherit;
				transition: all 0.15s;
				border: 1px solid rgba(196, 168, 130, 0.1);
			}
			.focus-btn:active {
				background: rgba(196, 168, 130, 0.15);
			}
			.rest-hdr {
				padding: 0 24px;
				margin-bottom: 14px;
				display: flex;
				justify-content: space-between;
				align-items: center;
			}
			.rest-hdr h2 {
				font-family: 'Playfair Display', serif;
				font-size: 15px;
				font-weight: 600;
			}
			.rest-hdr h2 span {
				color: var(--muted);
				font-weight: 400;
			}
			.rest-hdr .sort {
				font-size: 11px;
				color: var(--accent);
				font-style: italic;
			}
			.grid {
				display: grid;
				grid-template-columns: repeat(4, 1fr);
				gap: 10px;
				padding: 0 24px 40px;
			}
			.item {
				text-align: center;
			}
			.item img {
				width: 100%;
				aspect-ratio: 3/4;
				object-fit: cover;
				border-radius: 6px;
				box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
				transition: transform 0.15s;
			}
			.item:active img {
				transform: scale(0.93);
			}
			.item .t {
				font-size: 10px;
				margin-top: 5px;
				overflow: hidden;
				text-overflow: ellipsis;
				white-space: nowrap;
				color: var(--muted);
			}
			.item .pct {
				display: inline-flex;
				margin-top: 3px;
				width: 20px;
				height: 20px;
				border-radius: 50%;
				background: var(--card);
				font-size: 8px;
				align-items: center;
				justify-content: center;
				color: var(--accent);
			}
		</style>
	</head>
	<body>
		<div class="header">
			<h1>My Library</h1>
			<button>+</button>
		</div>
		<div class="focus-sec">
			<div class="focus-label">✦ Currently Reading</div>
			<div class="focus-row">
				<img class="cover" src="https://picsum.photos/seed/gatsby/300/420" alt="" loading="lazy" />
				<div class="info">
					<div class="t">The Great Gatsby</div>
					<div class="a">F. Scott Fitzgerald</div>
					<div class="q">"So we beat on, boats against the current..."</div>
				</div>
			</div>
			<div class="focus-prog">
				<div class="row1">
					<span>Chapter 7 of 9</span><span><strong>72%</strong> complete</span>
				</div>
				<div class="track"><div class="fill"></div></div>
			</div>
			<button class="focus-btn">⟳ Continue Reading</button>
		</div>
		<div class="rest-hdr">
			<h2>The Shelves <span>· 8 more</span></h2>
			<span class="sort">Sort ↕</span>
		</div>
		<div class="grid" id="g"></div>
		<script>
			const b = [
				{ t: '1984', a: 'George Orwell', s: '1984', p: 34 },
				{ t: 'Pride & Prejudice', a: 'Jane Austen', s: 'pride', p: 91 },
				{ t: 'The Hobbit', a: 'J.R.R. Tolkien', s: 'hobbit', p: 15 },
				{ t: 'Dune', a: 'Frank Herbert', s: 'dune', p: 58 },
				{ t: 'Neuromancer', a: 'W. Gibson', s: 'neuromancer', p: 7 },
				{ t: 'Brave New World', a: 'A. Huxley', s: 'brave', p: 44 },
				{ t: 'Fahrenheit 451', a: 'R. Bradbury', s: 'fahrenheit', p: 100 },
				{ t: 'Catcher in the Rye', a: 'J.D. Salinger', s: 'catcher', p: 23 }
			];
			document.getElementById('g').innerHTML = b
				.map(
					(x) =>
						`<div class="item"><img src="https://picsum.photos/seed/${x.s}/200/280" alt="${x.t}" loading="lazy"><div class="t">${x.t}</div><span class="pct">${x.p}%</span></div>`
				)
				.join('');
		</script>
	</body>
</html>
