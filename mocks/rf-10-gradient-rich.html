<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
		/>
		<title>10 — Gradient Rich</title>
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
			rel="stylesheet"
		/>
		<style>
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}
			:root {
				--text: #e0dce8;
				--muted: #7a7a9a;
				--radius: 16px;
			}
			body {
				font-family: 'Inter', sans-serif;
				min-height: 100vh;
				color: var(--text);
				background: linear-gradient(160deg, #0f0c1b 0%, #1a0f1a 30%, #0f141e 60%, #0c0f18 100%);
			}
			body::before {
				content: '';
				position: fixed;
				inset: 0;
				background:
					radial-gradient(ellipse at 70% 20%, rgba(192, 132, 252, 0.03) 0%, transparent 50%),
					radial-gradient(ellipse at 30% 80%, rgba(56, 189, 248, 0.02) 0%, transparent 50%);
				pointer-events: none;
			}
			.header {
				display: flex;
				justify-content: space-between;
				align-items: center;
				padding: 24px 20px 0;
			}
			.header h1 {
				font-size: 22px;
				font-weight: 700;
				background: linear-gradient(135deg, #c084fc, #60a5fa, #38bdf8);
				-webkit-background-clip: text;
				-webkit-text-fill-color: transparent;
				background-clip: text;
				letter-spacing: -0.5px;
			}
			.header button {
				width: 40px;
				height: 40px;
				border-radius: 12px;
				border: none;
				background: linear-gradient(135deg, rgba(192, 132, 252, 0.15), rgba(96, 165, 250, 0.15));
				color: #c084fc;
				font-size: 18px;
				cursor: pointer;
				backdrop-filter: blur(10px);
				transition: all 0.15s;
			}
			.header button:active {
				transform: scale(0.92);
				background: linear-gradient(135deg, rgba(192, 132, 252, 0.25), rgba(96, 165, 250, 0.25));
			}
			.focus-sec {
				margin: 16px 20px;
				padding: 24px;
				border-radius: var(--radius);
				background: rgba(255, 255, 255, 0.02);
				border: 1px solid rgba(255, 255, 255, 0.04);
				position: relative;
				overflow: hidden;
			}
			.focus-sec::before {
				content: '';
				position: absolute;
				inset: 0;
				border-radius: var(--radius);
				padding: 1px;
				background: linear-gradient(
					135deg,
					rgba(192, 132, 252, 0.12),
					rgba(56, 189, 248, 0.08),
					transparent
				);
				-webkit-mask:
					linear-gradient(#fff 0 0) content-box,
					linear-gradient(#fff 0 0);
				-webkit-mask-composite: xor;
				mask-composite: exclude;
				pointer-events: none;
			}
			.focus-label {
				font-size: 10px;
				font-weight: 600;
				text-transform: uppercase;
				letter-spacing: 2px;
				background: linear-gradient(90deg, #c084fc, #60a5fa);
				-webkit-background-clip: text;
				-webkit-text-fill-color: transparent;
				background-clip: text;
				margin-bottom: 14px;
			}
			.focus-row {
				display: flex;
				gap: 18px;
			}
			.focus-row .cover {
				width: 90px;
				height: 126px;
				border-radius: 10px;
				object-fit: cover;
				flex-shrink: 0;
				box-shadow:
					0 8px 24px rgba(0, 0, 0, 0.3),
					0 0 0 1px rgba(255, 255, 255, 0.02);
			}
			.focus-row .info {
				flex: 1;
			}
			.focus-row .info .t {
				font-size: 19px;
				font-weight: 700;
				letter-spacing: -0.3px;
				background: linear-gradient(135deg, #e0dce8, #c4b8d8);
				-webkit-background-clip: text;
				-webkit-text-fill-color: transparent;
				background-clip: text;
			}
			.focus-row .info .a {
				font-size: 12px;
				color: var(--muted);
				margin-top: 2px;
			}
			.focus-row .info .q {
				font-size: 11px;
				color: var(--muted);
				margin-top: 6px;
				line-height: 1.5;
				padding-left: 10px;
				border-left: 2px solid rgba(192, 132, 252, 0.15);
			}
			.focus-prog {
				margin-top: 16px;
			}
			.focus-prog .row1 {
				display: flex;
				justify-content: space-between;
				font-size: 11px;
				color: var(--muted);
			}
			.focus-prog .row1 strong {
				background: linear-gradient(90deg, #c084fc, #60a5fa);
				-webkit-background-clip: text;
				-webkit-text-fill-color: transparent;
				background-clip: text;
			}
			.focus-prog .track {
				margin-top: 6px;
				height: 3px;
				background: rgba(255, 255, 255, 0.02);
				border-radius: 2px;
				overflow: hidden;
			}
			.focus-prog .track .fill {
				height: 100%;
				width: 72%;
				background: linear-gradient(90deg, #c084fc, #60a5fa, #38bdf8);
				border-radius: 2px;
				box-shadow: 0 0 8px rgba(192, 132, 252, 0.2);
			}
			.focus-btn {
				margin-top: 14px;
				padding: 11px 0;
				width: 100%;
				border: none;
				border-radius: 12px;
				background: linear-gradient(135deg, rgba(192, 132, 252, 0.1), rgba(96, 165, 250, 0.1));
				color: #c084fc;
				font-size: 12px;
				font-weight: 600;
				cursor: pointer;
				font-family: inherit;
				border: 1px solid rgba(192, 132, 252, 0.06);
				transition: all 0.15s;
			}
			.focus-btn:active {
				background: linear-gradient(135deg, rgba(192, 132, 252, 0.2), rgba(96, 165, 250, 0.2));
			}
			.rest-hdr {
				padding: 0 20px;
				margin-bottom: 14px;
				display: flex;
				justify-content: space-between;
				align-items: center;
			}
			.rest-hdr h2 {
				font-size: 14px;
				font-weight: 600;
			}
			.rest-hdr h2 span {
				color: var(--muted);
				font-weight: 400;
			}
			.rest-hdr .sort {
				font-size: 11px;
				background: linear-gradient(90deg, #c084fc, #60a5fa);
				-webkit-background-clip: text;
				-webkit-text-fill-color: transparent;
				background-clip: text;
			}
			.grid {
				display: grid;
				grid-template-columns: repeat(4, 1fr);
				gap: 10px;
				padding: 0 20px 40px;
			}
			.item {
				text-align: center;
			}
			.item img {
				width: 100%;
				aspect-ratio: 3/4;
				object-fit: cover;
				border-radius: 10px;
				box-shadow:
					0 4px 16px rgba(0, 0, 0, 0.2),
					0 0 0 1px rgba(255, 255, 255, 0.02);
				transition: transform 0.15s;
			}
			.item:active img {
				transform: scale(0.93);
			}
			.item .t {
				font-size: 10px;
				margin-top: 5px;
				overflow: hidden;
				text-overflow: ellipsis;
				white-space: nowrap;
				color: var(--muted);
			}
			.item .pct {
				display: inline-flex;
				margin-top: 3px;
				width: 22px;
				height: 22px;
				border-radius: 50%;
				background: linear-gradient(135deg, rgba(192, 132, 252, 0.08), rgba(96, 165, 250, 0.08));
				font-size: 9px;
				font-weight: 600;
				align-items: center;
				justify-content: center;
				background: linear-gradient(135deg, #c084fc, #60a5fa);
				-webkit-background-clip: text;
				-webkit-text-fill-color: transparent;
				background-clip: text;
				border: 1px solid rgba(192, 132, 252, 0.1);
			}
		</style>
	</head>
	<body>
		<div class="header">
			<h1>Library</h1>
			<button>+</button>
		</div>
		<div class="focus-sec">
			<div class="focus-label">Currently Reading</div>
			<div class="focus-row">
				<img class="cover" src="https://picsum.photos/seed/gatsby/300/420" alt="" loading="lazy" />
				<div class="info">
					<div class="t">The Great Gatsby</div>
					<div class="a">F. Scott Fitzgerald</div>
					<div class="q">"So we beat on, boats against the current..."</div>
				</div>
			</div>
			<div class="focus-prog">
				<div class="row1">
					<span>Chapter 7 of 9</span><span><strong>72%</strong> complete</span>
				</div>
				<div class="track"><div class="fill"></div></div>
			</div>
			<button class="focus-btn">Resume Reading</button>
		</div>
		<div class="rest-hdr">
			<h2>All Books <span>· 8 more</span></h2>
			<span class="sort">Sort</span>
		</div>
		<div class="grid" id="g"></div>
		<script>
			const b = [
				{ t: '1984', a: 'George Orwell', s: '1984', p: 34 },
				{ t: 'Pride & Prejudice', a: 'Jane Austen', s: 'pride', p: 91 },
				{ t: 'The Hobbit', a: 'J.R.R. Tolkien', s: 'hobbit', p: 15 },
				{ t: 'Dune', a: 'Frank Herbert', s: 'dune', p: 58 },
				{ t: 'Neuromancer', a: 'W. Gibson', s: 'neuromancer', p: 7 },
				{ t: 'Brave New World', a: 'A. Huxley', s: 'brave', p: 44 },
				{ t: 'Fahrenheit 451', a: 'R. Bradbury', s: 'fahrenheit', p: 100 },
				{ t: 'Catcher in the Rye', a: 'J.D. Salinger', s: 'catcher', p: 23 }
			];
			document.getElementById('g').innerHTML = b
				.map(
					(x) =>
						`<div class="item"><img src="https://picsum.photos/seed/${x.s}/200/280" alt="${x.t}" loading="lazy"><div class="t">${x.t}</div><span class="pct">${x.p}%</span></div>`
				)
				.join('');
		</script>
	</body>
</html>
