<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
		/>
		<title>08 — Brutalist</title>
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:wght@400;800;900&display=swap"
			rel="stylesheet"
		/>
		<style>
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}
			:root {
				--bg: #000;
				--surface: #0a0a0a;
				--card: #111;
				--text: #fff;
				--muted: #555;
				--radius: 0px;
			}
			body {
				font-family: 'Inter', sans-serif;
				background: var(--bg);
				color: var(--text);
				min-height: 100vh;
				font-weight: 400;
			}
			.header {
				display: flex;
				justify-content: space-between;
				align-items: center;
				padding: 20px 16px 0;
				border-bottom: 4px solid #fff;
				margin: 0 16px;
				padding-bottom: 12px;
			}
			.header h1 {
				font-size: 22px;
				font-weight: 900;
				text-transform: uppercase;
				letter-spacing: 1px;
			}
			.header button {
				width: 44px;
				height: 44px;
				border: 3px solid #fff;
				background: var(--bg);
				color: #fff;
				font-size: 22px;
				font-weight: 900;
				cursor: pointer;
				display: flex;
				align-items: center;
				justify-content: center;
				transition: all 0.1s;
			}
			.header button:active {
				background: #fff;
				color: #000;
			}
			.focus-sec {
				margin: 16px;
				padding: 16px;
				border: 3px solid #fff;
				background: var(--surface);
			}
			.focus-label {
				font-size: 12px;
				font-weight: 800;
				text-transform: uppercase;
				letter-spacing: 2px;
				margin-bottom: 14px;
				color: #fff;
			}
			.focus-row {
				display: flex;
				gap: 14px;
			}
			.focus-row .cover {
				width: 85px;
				height: 119px;
				object-fit: cover;
				flex-shrink: 0;
				border: 2px solid #fff;
			}
			.focus-row .info {
				flex: 1;
			}
			.focus-row .info .t {
				font-size: 18px;
				font-weight: 900;
				text-transform: uppercase;
				letter-spacing: 0.5px;
				line-height: 1.1;
			}
			.focus-row .info .a {
				font-size: 11px;
				color: var(--muted);
				margin-top: 2px;
				text-transform: uppercase;
				letter-spacing: 0.5px;
			}
			.focus-row .info .q {
				font-size: 10px;
				color: var(--muted);
				margin-top: 6px;
				line-height: 1.4;
				padding-left: 8px;
				border-left: 3px solid #fff;
				text-transform: uppercase;
				letter-spacing: 0.3px;
			}
			.focus-prog {
				margin-top: 14px;
			}
			.focus-prog .row1 {
				display: flex;
				justify-content: space-between;
				font-size: 10px;
				color: var(--muted);
				text-transform: uppercase;
			}
			.focus-prog .row1 strong {
				color: #fff;
			}
			.focus-prog .track {
				margin-top: 6px;
				height: 4px;
				background: #222;
				overflow: hidden;
			}
			.focus-prog .track .fill {
				height: 100%;
				width: 72%;
				background: #fff;
			}
			.focus-btn {
				margin-top: 12px;
				padding: 10px 0;
				width: 100%;
				border: 3px solid #fff;
				background: var(--bg);
				color: #fff;
				font-size: 11px;
				font-weight: 800;
				cursor: pointer;
				font-family: inherit;
				text-transform: uppercase;
				letter-spacing: 2px;
				transition: all 0.1s;
			}
			.focus-btn:active {
				background: #fff;
				color: #000;
			}
			.rest-hdr {
				padding: 0 16px;
				margin-bottom: 12px;
				display: flex;
				justify-content: space-between;
				align-items: center;
			}
			.rest-hdr h2 {
				font-size: 14px;
				font-weight: 800;
				text-transform: uppercase;
			}
			.rest-hdr h2 span {
				color: var(--muted);
			}
			.rest-hdr .sort {
				font-size: 11px;
				font-weight: 700;
				color: #fff;
				text-transform: uppercase;
			}
			.grid {
				display: grid;
				grid-template-columns: repeat(4, 1fr);
				gap: 6px;
				padding: 0 16px 40px;
			}
			.item {
				text-align: center;
				border: 2px solid #111;
			}
			.item img {
				width: 100%;
				aspect-ratio: 3/4;
				object-fit: cover;
				display: block;
				border-bottom: 2px solid #111;
			}
			.item:active {
				background: #fff;
			}
			.item:active .t {
				color: #000;
			}
			.item:active .pct {
				color: #000;
				border-color: #000;
			}
			.item .t {
				font-size: 8px;
				margin-top: 3px;
				padding: 0 2px;
				overflow: hidden;
				text-overflow: ellipsis;
				white-space: nowrap;
				color: var(--muted);
				text-transform: uppercase;
				letter-spacing: 0.5px;
				padding-bottom: 4px;
			}
			.item .pct {
				display: inline-flex;
				margin: 2px auto 4px;
				width: 18px;
				height: 18px;
				border: 2px solid #333;
				font-size: 7px;
				font-weight: 800;
				align-items: center;
				justify-content: center;
				color: var(--muted);
			}
		</style>
	</head>
	<body>
		<div class="header">
			<h1>Library</h1>
			<button>+</button>
		</div>
		<div class="focus-sec">
			<div class="focus-label">Now Reading</div>
			<div class="focus-row">
				<img class="cover" src="https://picsum.photos/seed/gatsby/300/420" alt="" loading="lazy" />
				<div class="info">
					<div class="t">The Great Gatsby</div>
					<div class="a">F. Scott Fitzgerald</div>
					<div class="q">"So we beat on, boats against the current..."</div>
				</div>
			</div>
			<div class="focus-prog">
				<div class="row1">
					<span>Ch 7/9</span><span><strong>72%</strong></span>
				</div>
				<div class="track"><div class="fill"></div></div>
			</div>
			<button class="focus-btn">Resume</button>
		</div>
		<div class="rest-hdr">
			<h2>All Books <span>· 8</span></h2>
			<span class="sort">Sort</span>
		</div>
		<div class="grid" id="g"></div>
		<script>
			const b = [
				{ t: '1984', a: 'George Orwell', s: '1984', p: 34 },
				{ t: 'Pride & Prejudice', a: 'Jane Austen', s: 'pride', p: 91 },
				{ t: 'The Hobbit', a: 'J.R.R. Tolkien', s: 'hobbit', p: 15 },
				{ t: 'Dune', a: 'Frank Herbert', s: 'dune', p: 58 },
				{ t: 'Neuromancer', a: 'W. Gibson', s: 'neuromancer', p: 7 },
				{ t: 'Brave New World', a: 'A. Huxley', s: 'brave', p: 44 },
				{ t: 'Fahrenheit 451', a: 'R. Bradbury', s: 'fahrenheit', p: 100 },
				{ t: 'Catcher in the Rye', a: 'J.D. Salinger', s: 'catcher', p: 23 }
			];
			document.getElementById('g').innerHTML = b
				.map(
					(x) =>
						`<div class="item"><img src="https://picsum.photos/seed/${x.s}/200/280" alt="${x.t}" loading="lazy"><div class="t">${x.t}</div><span class="pct">${x.p}%</span></div>`
				)
				.join('');
		</script>
	</body>
</html>
