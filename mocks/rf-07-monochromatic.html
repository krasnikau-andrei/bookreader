<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
		/>
		<title>07 — Monochromatic</title>
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
			rel="stylesheet"
		/>
		<style>
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}
			:root {
				--bg: #0c0e12;
				--surface: #12151c;
				--card: #181c24;
				--text: #c4cad4;
				--muted: #4a5266;
				--accent: #5b6a8a;
				--accent-dim: rgba(91, 106, 138, 0.05);
				--radius: 6px;
			}
			body {
				font-family: 'Inter', sans-serif;
				background: var(--bg);
				color: var(--text);
				min-height: 100vh;
				font-weight: 400;
			}
			body::before {
				content: '';
				position: fixed;
				inset: 0;
				background:
					repeating-linear-gradient(
						0deg,
						transparent,
						transparent 40px,
						rgba(91, 106, 138, 0.015) 40px,
						rgba(91, 106, 138, 0.015) 41px
					),
					repeating-linear-gradient(
						90deg,
						transparent,
						transparent 40px,
						rgba(91, 106, 138, 0.015) 40px,
						rgba(91, 106, 138, 0.015) 41px
					);
				pointer-events: none;
			}
			.header {
				display: flex;
				justify-content: space-between;
				align-items: center;
				padding: 24px 20px 0;
			}
			.header h1 {
				font-size: 18px;
				font-weight: 500;
				letter-spacing: -0.3px;
				color: #e0e4ec;
			}
			.header button {
				width: 36px;
				height: 36px;
				border-radius: var(--radius);
				border: 1px solid #1e222b;
				background: var(--surface);
				color: var(--muted);
				font-size: 16px;
				cursor: pointer;
				transition: all 0.15s;
			}
			.header button:active {
				background: #1a1e27;
				border-color: var(--accent);
				color: var(--accent);
			}
			.focus-sec {
				margin: 16px 20px;
				padding: 20px;
				border-radius: var(--radius);
				background: var(--surface);
				border: 1px solid #181c24;
			}
			.focus-label {
				font-size: 10px;
				font-weight: 600;
				text-transform: uppercase;
				letter-spacing: 2px;
				color: var(--accent);
				margin-bottom: 14px;
			}
			.focus-row {
				display: flex;
				gap: 16px;
			}
			.focus-row .cover {
				width: 88px;
				height: 123px;
				border-radius: 4px;
				object-fit: cover;
				flex-shrink: 0;
				filter: grayscale(0.7) brightness(0.7);
			}
			.focus-row .info {
				flex: 1;
			}
			.focus-row .info .t {
				font-size: 18px;
				font-weight: 500;
				letter-spacing: -0.3px;
				color: #e0e4ec;
			}
			.focus-row .info .a {
				font-size: 11px;
				color: var(--muted);
				margin-top: 2px;
			}
			.focus-row .info .q {
				font-size: 11px;
				color: var(--muted);
				margin-top: 6px;
				font-weight: 300;
				line-height: 1.5;
				padding-left: 8px;
				border-left: 2px solid var(--accent-dim);
			}
			.focus-prog {
				margin-top: 14px;
			}
			.focus-prog .row1 {
				display: flex;
				justify-content: space-between;
				font-size: 10px;
				color: var(--muted);
			}
			.focus-prog .row1 strong {
				color: var(--accent);
				font-weight: 600;
			}
			.focus-prog .track {
				margin-top: 6px;
				height: 3px;
				background: rgba(255, 255, 255, 0.02);
				border-radius: 2px;
				overflow: hidden;
			}
			.focus-prog .track .fill {
				height: 100%;
				width: 72%;
				background: var(--accent);
				border-radius: 2px;
			}
			.focus-btn {
				margin-top: 12px;
				padding: 10px 0;
				width: 100%;
				border: 1px solid #1e222b;
				border-radius: var(--radius);
				background: transparent;
				color: var(--accent);
				font-size: 11px;
				font-weight: 500;
				cursor: pointer;
				font-family: inherit;
				transition: all 0.15s;
				letter-spacing: 0.5px;
			}
			.focus-btn:active {
				background: var(--accent-dim);
			}
			.rest-hdr {
				padding: 0 20px;
				margin-bottom: 12px;
				display: flex;
				justify-content: space-between;
				align-items: center;
			}
			.rest-hdr h2 {
				font-size: 13px;
				font-weight: 500;
			}
			.rest-hdr h2 span {
				color: var(--muted);
				font-weight: 400;
			}
			.rest-hdr .sort {
				font-size: 10px;
				color: var(--accent);
			}
			.grid {
				display: grid;
				grid-template-columns: repeat(4, 1fr);
				gap: 8px;
				padding: 0 20px 40px;
			}
			.item {
				text-align: center;
			}
			.item img {
				width: 100%;
				aspect-ratio: 3/4;
				object-fit: cover;
				border-radius: 4px;
				filter: grayscale(0.6) brightness(0.7);
				transition: all 0.15s;
			}
			.item:active img {
				filter: grayscale(0.3) brightness(0.8);
				transform: scale(0.93);
			}
			.item .t {
				font-size: 9px;
				margin-top: 4px;
				overflow: hidden;
				text-overflow: ellipsis;
				white-space: nowrap;
				color: var(--muted);
				letter-spacing: 0.3px;
			}
			.item .pct {
				display: inline-flex;
				margin-top: 3px;
				width: 18px;
				height: 18px;
				border-radius: 50%;
				border: 1px solid #1e222b;
				font-size: 8px;
				align-items: center;
				justify-content: center;
				color: var(--accent);
				background: transparent;
			}
		</style>
	</head>
	<body>
		<div class="header">
			<h1>library</h1>
			<button>+</button>
		</div>
		<div class="focus-sec">
			<div class="focus-label">reading</div>
			<div class="focus-row">
				<img class="cover" src="https://picsum.photos/seed/gatsby/300/420" alt="" loading="lazy" />
				<div class="info">
					<div class="t">The Great Gatsby</div>
					<div class="a">F. Scott Fitzgerald</div>
					<div class="q">"So we beat on, boats against the current..."</div>
				</div>
			</div>
			<div class="focus-prog">
				<div class="row1">
					<span>ch 7/9</span><span><strong>72%</strong></span>
				</div>
				<div class="track"><div class="fill"></div></div>
			</div>
			<button class="focus-btn">resume</button>
		</div>
		<div class="rest-hdr">
			<h2>all titles <span>· 8</span></h2>
			<span class="sort">sort</span>
		</div>
		<div class="grid" id="g"></div>
		<script>
			const b = [
				{ t: '1984', a: 'George Orwell', s: '1984', p: 34 },
				{ t: 'Pride & Prejudice', a: 'Jane Austen', s: 'pride', p: 91 },
				{ t: 'The Hobbit', a: 'J.R.R. Tolkien', s: 'hobbit', p: 15 },
				{ t: 'Dune', a: 'Frank Herbert', s: 'dune', p: 58 },
				{ t: 'Neuromancer', a: 'W. Gibson', s: 'neuromancer', p: 7 },
				{ t: 'Brave New World', a: 'A. Huxley', s: 'brave', p: 44 },
				{ t: 'Fahrenheit 451', a: 'R. Bradbury', s: 'fahrenheit', p: 100 },
				{ t: 'Catcher in the Rye', a: 'J.D. Salinger', s: 'catcher', p: 23 }
			];
			document.getElementById('g').innerHTML = b
				.map(
					(x) =>
						`<div class="item"><img src="https://picsum.photos/seed/${x.s}/200/280" alt="${x.t}" loading="lazy"><div class="t">${x.t}</div><span class="pct">${x.p}%</span></div>`
				)
				.join('');
		</script>
	</body>
</html>
