<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
		/>
		<title>Mock 2 — Genre Carousel</title>
		<link
			href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap"
			rel="stylesheet"
		/>
		<style>
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}
			:root {
				--coral: #ff6b6b;
				--coral-dim: rgba(255, 107, 107, 0.1);
				--navy: #0a0e1a;
				--surface: #111627;
				--card: #161d30;
				--text: #eef0f5;
				--muted: #5f6b8a;
			}
			body {
				font-family: 'Outfit', sans-serif;
				background: var(--navy);
				color: var(--text);
				min-height: 100vh;
				padding: 20px 0 40px;
				overflow-x: hidden;
			}
			body::before {
				content: '';
				position: fixed;
				inset: 0;
				background:
					radial-gradient(ellipse at 100% 0%, rgba(255, 107, 107, 0.06) 0%, transparent 60%),
					radial-gradient(ellipse at 0% 100%, rgba(100, 150, 255, 0.04) 0%, transparent 60%);
				pointer-events: none;
			}
			.top {
				display: flex;
				justify-content: space-between;
				align-items: center;
				padding: 0 20px;
				margin-bottom: 8px;
			}
			.top h1 {
				font-size: 26px;
				font-weight: 700;
				letter-spacing: -0.5px;
			}
			.top-actions {
				display: flex;
				gap: 10px;
			}
			.top-actions button {
				width: 42px;
				height: 42px;
				border-radius: 12px;
				border: 1px solid rgba(255, 255, 255, 0.06);
				background: var(--surface);
				color: var(--muted);
				font-size: 18px;
				cursor: pointer;
				transition: all 0.15s;
			}
			.top-actions button:active {
				background: var(--coral-dim);
				color: var(--coral);
			}
			.search-bar {
				margin: 16px 20px 24px;
				padding: 12px 16px;
				border-radius: 12px;
				background: var(--surface);
				border: 1px solid rgba(255, 255, 255, 0.04);
				display: flex;
				align-items: center;
				gap: 10px;
			}
			.search-bar input {
				background: none;
				border: none;
				outline: none;
				color: var(--text);
				font-size: 14px;
				font-family: inherit;
				flex: 1;
			}
			.search-bar input::placeholder {
				color: var(--muted);
			}
			.search-bar span {
				color: var(--muted);
				font-size: 16px;
			}
			.section {
				margin-bottom: 28px;
			}
			.section-header {
				display: flex;
				justify-content: space-between;
				align-items: center;
				padding: 0 20px;
				margin-bottom: 12px;
			}
			.section-header h2 {
				font-size: 16px;
				font-weight: 600;
				letter-spacing: -0.3px;
			}
			.section-header .see-all {
				font-size: 12px;
				color: var(--coral);
				font-weight: 500;
				text-decoration: none;
			}
			.scroll-row {
				display: flex;
				gap: 12px;
				padding: 0 20px;
				overflow-x: auto;
				scroll-snap-type: x mandatory;
				-webkit-overflow-scrolling: touch;
				scrollbar-width: none;
			}
			.scroll-row::-webkit-scrollbar {
				display: none;
			}
			.scroll-row .card {
				flex: 0 0 130px;
				scroll-snap-align: start;
			}
			.scroll-row .card img {
				width: 100%;
				aspect-ratio: 3/4;
				border-radius: 10px;
				object-fit: cover;
				display: block;
				box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
				transition: transform 0.15s;
			}
			.scroll-row .card:active img {
				transform: scale(0.95);
			}
			.scroll-row .card .title {
				font-size: 12px;
				font-weight: 500;
				margin-top: 6px;
				overflow: hidden;
				text-overflow: ellipsis;
				white-space: nowrap;
				color: var(--text);
			}
			.scroll-row .card .sub {
				font-size: 10px;
				color: var(--muted);
				margin-top: 1px;
			}
			.scroll-row .card .pct-tag {
				display: inline-block;
				margin-top: 4px;
				font-size: 10px;
				font-weight: 600;
				color: var(--coral);
				background: var(--coral-dim);
				padding: 2px 8px;
				border-radius: 4px;
			}
			.hero {
				margin: 12px 20px 28px;
				border-radius: 18px;
				overflow: hidden;
				position: relative;
			}
			.hero img {
				width: 100%;
				aspect-ratio: 16/9;
				object-fit: cover;
				display: block;
			}
			.hero .overlay {
				position: absolute;
				inset: 0;
				background: linear-gradient(0deg, rgba(10, 14, 26, 0.95) 0%, transparent 60%);
				display: flex;
				flex-direction: column;
				justify-content: flex-end;
				padding: 20px;
			}
			.hero .overlay .tag {
				font-size: 10px;
				font-weight: 600;
				text-transform: uppercase;
				letter-spacing: 2px;
				color: var(--coral);
			}
			.hero .overlay h2 {
				font-size: 22px;
				font-weight: 700;
				margin-top: 4px;
				letter-spacing: -0.3px;
			}
			.hero .overlay .author {
				font-size: 13px;
				color: rgba(255, 255, 255, 0.6);
				margin-top: 2px;
			}
			.hero .overlay .progress {
				margin-top: 10px;
				display: flex;
				align-items: center;
				gap: 10px;
			}
			.hero .overlay .progress .track {
				flex: 1;
				height: 4px;
				background: rgba(255, 255, 255, 0.1);
				border-radius: 2px;
				overflow: hidden;
			}
			.hero .overlay .progress .track .fill {
				height: 100%;
				width: 72%;
				background: var(--coral);
				border-radius: 2px;
			}
			.hero .overlay .progress .pct {
				font-size: 14px;
				font-weight: 700;
				color: var(--coral);
			}
		</style>
	</head>
	<body>
		<div class="top">
			<h1>Library</h1>
			<div class="top-actions">
				<button>⊞</button>
				<button>+</button>
			</div>
		</div>

		<div class="search-bar"><span>🔍</span><input placeholder="Search books..." value="" /></div>

		<div class="hero" id="hero"></div>

		<div class="section">
			<div class="section-header">
				<h2>📖 Fiction</h2>
				<a class="see-all" href="#">See all</a>
			</div>
			<div class="scroll-row" id="fiction-row"></div>
		</div>

		<div class="section">
			<div class="section-header">
				<h2>🚀 Sci-Fi</h2>
				<a class="see-all" href="#">See all</a>
			</div>
			<div class="scroll-row" id="scifi-row"></div>
		</div>

		<div class="section">
			<div class="section-header">
				<h2>📜 Classics</h2>
				<a class="see-all" href="#">See all</a>
			</div>
			<div class="scroll-row" id="classics-row"></div>
		</div>

		<script>
			const books = [
				{
					title: 'The Great Gatsby',
					author: 'F. Scott Fitzgerald',
					seed: 'gatsby',
					pct: 72,
					genre: 'fiction'
				},
				{ title: '1984', author: 'George Orwell', seed: '1984', pct: 34, genre: 'scifi' },
				{
					title: 'Pride and Prejudice',
					author: 'Jane Austen',
					seed: 'pride',
					pct: 91,
					genre: 'classics'
				},
				{
					title: 'The Hobbit',
					author: 'J.R.R. Tolkien',
					seed: 'hobbit',
					pct: 15,
					genre: 'fiction'
				},
				{ title: 'Dune', author: 'Frank Herbert', seed: 'dune', pct: 58, genre: 'scifi' },
				{
					title: 'Neuromancer',
					author: 'William Gibson',
					seed: 'neuromancer',
					pct: 7,
					genre: 'scifi'
				},
				{
					title: 'Brave New World',
					author: 'Aldous Huxley',
					seed: 'brave',
					pct: 44,
					genre: 'scifi'
				},
				{
					title: 'Fahrenheit 451',
					author: 'Ray Bradbury',
					seed: 'fahrenheit',
					pct: 100,
					genre: 'classics'
				},
				{
					title: 'The Catcher in the Rye',
					author: 'J.D. Salinger',
					seed: 'catcher',
					pct: 23,
					genre: 'classics'
				}
			];

			document.getElementById('hero').innerHTML = `
      <img src="https://picsum.photos/seed/dune-hero/800/450" alt="" loading="lazy">
      <div class="overlay">
        <div class="tag">Staff Pick</div>
        <h2>Dune</h2>
        <div class="author">Frank Herbert</div>
        <div class="progress"><div class="track"><div class="fill" style="width:58%"></div></div><span class="pct">58%</span></div>
      </div>
    `;

			const fiction = books.filter((b) => b.genre === 'fiction');
			const scifi = books.filter((b) => b.genre === 'scifi');
			const classics = books.filter((b) => b.genre === 'classics');

			function renderRow(books, elId) {
				document.getElementById(elId).innerHTML = books
					.map(
						(b) => `
        <div class="card">
          <img src="https://picsum.photos/seed/${b.seed}/300/420" alt="${b.title}" loading="lazy">
          <div class="title">${b.title}</div>
          <div class="sub">${b.author}</div>
          <span class="pct-tag">${b.pct}%</span>
        </div>
      `
					)
					.join('');
			}

			renderRow(fiction, 'fiction-row');
			renderRow(scifi, 'scifi-row');
			renderRow(classics, 'classics-row');
		</script>
	</body>
</html>
