<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
		/>
		<title>Mock 1 — List Progress</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link
			href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,500;9..40,700&display=swap"
			rel="stylesheet"
		/>
		<style>
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}
			:root {
				--amber: #d97706;
				--amber-dim: rgba(217, 119, 6, 0.12);
				--bg: #0c0c0e;
				--surface: #141417;
				--border: #1e1e24;
				--text: #e8e6e3;
				--muted: #6b6a72;
			}
			body {
				font-family: 'DM Sans', sans-serif;
				background: var(--bg);
				color: var(--text);
				min-height: 100vh;
				padding: 20px 16px;
			}
			body::before {
				content: '';
				position: fixed;
				inset: 0;
				background-image: radial-gradient(circle, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
				background-size: 20px 20px;
				pointer-events: none;
			}
			.top {
				display: flex;
				justify-content: space-between;
				align-items: center;
				margin-bottom: 28px;
				padding: 0 4px;
			}
			.top h1 {
				font-size: 20px;
				font-weight: 700;
				letter-spacing: -0.5px;
				color: var(--text);
			}
			.top-actions {
				display: flex;
				gap: 12px;
			}
			.top-actions button {
				width: 40px;
				height: 40px;
				border-radius: 10px;
				border: none;
				background: var(--surface);
				color: var(--muted);
				font-size: 18px;
				cursor: pointer;
				border: 1px solid var(--border);
				transition: all 0.15s;
			}
			.top-actions button:active {
				background: var(--amber-dim);
				color: var(--amber);
				border-color: var(--amber);
			}
			.section-label {
				font-size: 11px;
				font-weight: 700;
				text-transform: uppercase;
				letter-spacing: 1.5px;
				color: var(--muted);
				margin-bottom: 14px;
			}
			.book-list {
				display: flex;
				flex-direction: column;
				gap: 10px;
			}
			.book-item {
				display: flex;
				align-items: center;
				gap: 14px;
				background: var(--surface);
				border-radius: 14px;
				padding: 10px;
				border: 1px solid var(--border);
				transition: all 0.15s;
			}
			.book-item:active {
				border-color: rgba(217, 119, 6, 0.2);
				background: #19191e;
			}
			.book-item .cover {
				width: 56px;
				height: 78px;
				border-radius: 8px;
				object-fit: cover;
				flex-shrink: 0;
			}
			.book-item .info {
				flex: 1;
				min-width: 0;
			}
			.book-item .info .title {
				font-size: 14px;
				font-weight: 600;
				letter-spacing: -0.2px;
				overflow: hidden;
				text-overflow: ellipsis;
				white-space: nowrap;
			}
			.book-item .info .author {
				font-size: 12px;
				color: var(--muted);
				margin-top: 1px;
				font-weight: 400;
			}
			.book-item .info .meta {
				display: flex;
				align-items: center;
				gap: 8px;
				margin-top: 6px;
			}
			.book-item .info .meta .pct {
				font-size: 11px;
				font-weight: 600;
				color: var(--amber);
				min-width: 28px;
			}
			.progress-track {
				flex: 1;
				height: 4px;
				background: rgba(255, 255, 255, 0.06);
				border-radius: 2px;
				overflow: hidden;
			}
			.progress-track .fill {
				height: 100%;
				background: var(--amber);
				border-radius: 2px;
				transition: width 0.3s;
			}
			.book-item .chevron {
				color: var(--muted);
				font-size: 16px;
				opacity: 0.4;
			}
			.currently-reading {
				margin-bottom: 32px;
			}
			.current-hero {
				display: flex;
				gap: 20px;
				background: linear-gradient(135deg, rgba(217, 119, 6, 0.08), transparent);
				border-radius: 20px;
				padding: 16px;
				border: 1px solid rgba(217, 119, 6, 0.12);
				margin-top: 10px;
			}
			.current-hero .cover {
				width: 90px;
				height: 126px;
				border-radius: 10px;
				object-fit: cover;
				flex-shrink: 0;
				box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
			}
			.current-hero .info {
				flex: 1;
				display: flex;
				flex-direction: column;
				justify-content: center;
			}
			.current-hero .info .title {
				font-size: 18px;
				font-weight: 700;
				letter-spacing: -0.3px;
			}
			.current-hero .info .author {
				font-size: 13px;
				color: var(--muted);
				margin-top: 2px;
			}
			.current-hero .info .big-progress {
				margin-top: 12px;
			}
			.current-hero .info .big-progress .pct {
				font-size: 28px;
				font-weight: 700;
				color: var(--amber);
			}
			.current-hero .info .big-progress .track {
				height: 6px;
				background: rgba(255, 255, 255, 0.06);
				border-radius: 3px;
				overflow: hidden;
				margin-top: 6px;
			}
			.current-hero .info .big-progress .track .fill {
				height: 100%;
				background: linear-gradient(90deg, var(--amber), #f59e0b);
				border-radius: 3px;
			}
			.current-hero .info .continue-btn {
				margin-top: 14px;
				padding: 10px 24px;
				border: none;
				border-radius: 10px;
				background: var(--amber);
				color: #0c0c0e;
				font-size: 13px;
				font-weight: 700;
				cursor: pointer;
				font-family: inherit;
				align-self: flex-start;
			}
		</style>
	</head>
	<body>
		<div class="top">
			<h1>My Library</h1>
			<div class="top-actions">
				<button>🔍</button>
				<button>+</button>
			</div>
		</div>

		<section class="currently-reading">
			<div class="section-label">★ Currently Reading</div>
			<div class="current-hero" id="current-hero"></div>
		</section>

		<section>
			<div class="section-label">All Books</div>
			<div class="book-list" id="book-list"></div>
		</section>

		<script>
			const books = [
				{ title: 'The Great Gatsby', author: 'F. Scott Fitzgerald', seed: 'gatsby', pct: 72 },
				{ title: '1984', author: 'George Orwell', seed: '1984', pct: 34 },
				{ title: 'Pride and Prejudice', author: 'Jane Austen', seed: 'pride', pct: 91 },
				{ title: 'The Hobbit', author: 'J.R.R. Tolkien', seed: 'hobbit', pct: 15 },
				{ title: 'Dune', author: 'Frank Herbert', seed: 'dune', pct: 58 },
				{ title: 'Neuromancer', author: 'William Gibson', seed: 'neuromancer', pct: 7 },
				{ title: 'Brave New World', author: 'Aldous Huxley', seed: 'brave', pct: 44 },
				{ title: 'Fahrenheit 451', author: 'Ray Bradbury', seed: 'fahrenheit', pct: 100 },
				{ title: 'The Catcher in the Rye', author: 'J.D. Salinger', seed: 'catcher', pct: 23 }
			];

			const current = books[0];
			document.getElementById('current-hero').innerHTML = `
      <img class="cover" src="https://picsum.photos/seed/${current.seed}/300/420" alt="${current.title}" loading="lazy">
      <div class="info">
        <div class="title">${current.title}</div>
        <div class="author">${current.author}</div>
        <div class="big-progress">
          <div class="pct">${current.pct}%</div>
          <div class="track"><div class="fill" style="width:${current.pct}%"></div></div>
        </div>
        <button class="continue-btn">Continue Reading →</button>
      </div>
    `;

			const list = document.getElementById('book-list');
			list.innerHTML = books
				.slice(1)
				.map(
					(b) => `
      <div class="book-item">
        <img class="cover" src="https://picsum.photos/seed/${b.seed}/300/420" alt="${b.title}" loading="lazy">
        <div class="info">
          <div class="title">${b.title}</div>
          <div class="author">${b.author}</div>
          <div class="meta">
            <span class="pct">${b.pct}%</span>
            <div class="progress-track"><div class="fill" style="width:${b.pct}%"></div></div>
          </div>
        </div>
        <span class="chevron">›</span>
      </div>
    `
				)
				.join('');
		</script>
	</body>
</html>
