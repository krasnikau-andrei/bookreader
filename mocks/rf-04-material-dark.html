<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
		/>
		<title>04 — Material Dark</title>
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
			rel="stylesheet"
		/>
		<style>
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}
			:root {
				--bg: #121212;
				--surface: #1e1e1e;
				--card: #2a2a2a;
				--text: #e0e0e0;
				--muted: #9e9e9e;
				--accent: #03dac6;
				--accent-dim: rgba(3, 218, 198, 0.08);
				--radius: 16px;
			}
			body {
				font-family: 'Inter', sans-serif;
				background: var(--bg);
				color: var(--text);
				min-height: 100vh;
			}
			.header {
				display: flex;
				justify-content: space-between;
				align-items: center;
				padding: 24px 16px 0;
			}
			.header h1 {
				font-size: 24px;
				font-weight: 700;
				letter-spacing: -0.3px;
				color: #fff;
			}
			.header button {
				width: 56px;
				height: 56px;
				border-radius: 50%;
				border: none;
				background: var(--accent);
				color: #121212;
				font-size: 28px;
				cursor: pointer;
				box-shadow: 0 4px 12px rgba(3, 218, 198, 0.25);
				transition: all 0.15s;
				display: flex;
				align-items: center;
				justify-content: center;
			}
			.header button:active {
				transform: scale(0.92);
				box-shadow: 0 2px 6px rgba(3, 218, 198, 0.15);
			}
			.focus-sec {
				margin: 16px 16px 20px;
				padding: 20px;
				border-radius: var(--radius);
				background: var(--surface);
				box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
			}
			.focus-label {
				font-size: 12px;
				font-weight: 600;
				text-transform: uppercase;
				letter-spacing: 1px;
				color: var(--accent);
				margin-bottom: 14px;
			}
			.focus-row {
				display: flex;
				gap: 18px;
			}
			.focus-row .cover {
				width: 96px;
				height: 134px;
				border-radius: 12px;
				object-fit: cover;
				flex-shrink: 0;
				box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
			}
			.focus-row .info {
				flex: 1;
			}
			.focus-row .info .t {
				font-size: 20px;
				font-weight: 600;
				letter-spacing: -0.3px;
				color: #fff;
			}
			.focus-row .info .a {
				font-size: 13px;
				color: var(--muted);
				margin-top: 2px;
			}
			.focus-row .info .q {
				font-size: 12px;
				color: var(--muted);
				margin-top: 6px;
				line-height: 1.4;
				padding-left: 10px;
				border-left: 3px solid var(--accent-dim);
			}
			.focus-prog {
				margin-top: 16px;
			}
			.focus-prog .row1 {
				display: flex;
				justify-content: space-between;
				font-size: 12px;
				color: var(--muted);
			}
			.focus-prog .row1 strong {
				color: var(--accent);
			}
			.focus-prog .track {
				margin-top: 8px;
				height: 4px;
				background: rgba(255, 255, 255, 0.04);
				border-radius: 4px;
				overflow: hidden;
			}
			.focus-prog .track .fill {
				height: 100%;
				width: 72%;
				background: var(--accent);
				border-radius: 4px;
			}
			.focus-btn {
				margin-top: 16px;
				padding: 12px 0;
				width: 100%;
				border: none;
				border-radius: 12px;
				background: var(--accent);
				color: #121212;
				font-size: 13px;
				font-weight: 600;
				cursor: pointer;
				font-family: inherit;
				transition: all 0.15s;
			}
			.focus-btn:active {
				opacity: 0.8;
			}
			.rest-hdr {
				padding: 0 16px;
				margin-bottom: 14px;
				display: flex;
				justify-content: space-between;
				align-items: center;
			}
			.rest-hdr h2 {
				font-size: 16px;
				font-weight: 600;
			}
			.rest-hdr h2 span {
				color: var(--muted);
				font-weight: 400;
			}
			.rest-hdr .sort {
				font-size: 12px;
				color: var(--accent);
				font-weight: 500;
			}
			.grid {
				display: grid;
				grid-template-columns: repeat(4, 1fr);
				gap: 10px;
				padding: 0 16px 40px;
			}
			.item {
				text-align: center;
			}
			.item img {
				width: 100%;
				aspect-ratio: 3/4;
				object-fit: cover;
				border-radius: 10px;
				box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
				transition: transform 0.15s;
			}
			.item:active img {
				transform: scale(0.93);
			}
			.item .t {
				font-size: 11px;
				margin-top: 6px;
				overflow: hidden;
				text-overflow: ellipsis;
				white-space: nowrap;
				color: var(--text);
			}
			.item .pct {
				display: inline-flex;
				margin-top: 4px;
				width: 22px;
				height: 22px;
				border-radius: 50%;
				background: var(--accent-dim);
				font-size: 9px;
				font-weight: 600;
				align-items: center;
				justify-content: center;
				color: var(--accent);
			}
		</style>
	</head>
	<body>
		<div class="header">
			<h1>Library</h1>
			<button>+</button>
		</div>
		<div class="focus-sec">
			<div class="focus-label">Currently Reading</div>
			<div class="focus-row">
				<img class="cover" src="https://picsum.photos/seed/gatsby/300/420" alt="" loading="lazy" />
				<div class="info">
					<div class="t">The Great Gatsby</div>
					<div class="a">F. Scott Fitzgerald</div>
					<div class="q">"So we beat on, boats against the current..."</div>
				</div>
			</div>
			<div class="focus-prog">
				<div class="row1">
					<span>Chapter 7 of 9</span><span><strong>72%</strong> complete</span>
				</div>
				<div class="track"><div class="fill"></div></div>
			</div>
			<button class="focus-btn">Continue Reading</button>
		</div>
		<div class="rest-hdr">
			<h2>All Books <span>· 8 more</span></h2>
			<span class="sort">Sort</span>
		</div>
		<div class="grid" id="g"></div>
		<script>
			const b = [
				{ t: '1984', a: 'George Orwell', s: '1984', p: 34 },
				{ t: 'Pride & Prejudice', a: 'Jane Austen', s: 'pride', p: 91 },
				{ t: 'The Hobbit', a: 'J.R.R. Tolkien', s: 'hobbit', p: 15 },
				{ t: 'Dune', a: 'Frank Herbert', s: 'dune', p: 58 },
				{ t: 'Neuromancer', a: 'W. Gibson', s: 'neuromancer', p: 7 },
				{ t: 'Brave New World', a: 'A. Huxley', s: 'brave', p: 44 },
				{ t: 'Fahrenheit 451', a: 'R. Bradbury', s: 'fahrenheit', p: 100 },
				{ t: 'Catcher in the Rye', a: 'J.D. Salinger', s: 'catcher', p: 23 }
			];
			document.getElementById('g').innerHTML = b
				.map(
					(x) =>
						`<div class="item"><img src="https://picsum.photos/seed/${x.s}/200/280" alt="${x.t}" loading="lazy"><div class="t">${x.t}</div><span class="pct">${x.p}%</span></div>`
				)
				.join('');
		</script>
	</body>
</html>
