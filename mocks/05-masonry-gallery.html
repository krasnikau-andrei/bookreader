<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
		/>
		<title>Mock 5 — Masonry Gallery</title>
		<link
			href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,300,50;9..144,500,50;9..144,700,50&display=swap"
			rel="stylesheet"
		/>
		<style>
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}
			:root {
				--rose: #e11d48;
				--rose-dim: rgba(225, 29, 72, 0.08);
				--bg: #0d080a;
				--surface: #140c0f;
				--text: #e8dce0;
				--muted: #7a5a62;
			}
			body {
				font-family: 'Fraunces', serif;
				background: var(--bg);
				color: var(--text);
				min-height: 100vh;
				padding: 20px 16px;
			}
			body::before {
				content: '';
				position: fixed;
				inset: 0;
				background: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.02'/%3E%3C/svg%3E");
				pointer-events: none;
			}
			nav {
				display: flex;
				justify-content: space-between;
				align-items: center;
				margin-bottom: 20px;
			}
			nav h1 {
				font-size: 18px;
				font-weight: 500;
				font-variation-settings: 'SOFT' 50;
				letter-spacing: -0.3px;
			}
			nav .actions {
				display: flex;
				gap: 8px;
			}
			nav .actions button {
				width: 38px;
				height: 38px;
				border-radius: 12px;
				border: none;
				background: var(--surface);
				color: var(--muted);
				font-size: 16px;
				cursor: pointer;
				border: 1px solid rgba(255, 255, 255, 0.02);
				transition: all 0.15s;
			}
			nav .actions button:active {
				background: var(--rose-dim);
				color: var(--rose);
			}
			.filter-row {
				display: flex;
				gap: 8px;
				margin-bottom: 20px;
				overflow-x: auto;
				scrollbar-width: none;
			}
			.filter-row::-webkit-scrollbar {
				display: none;
			}
			.filter-row .chip {
				padding: 8px 16px;
				border-radius: 24px;
				border: 1px solid rgba(255, 255, 255, 0.04);
				background: var(--surface);
				font-size: 12px;
				font-weight: 500;
				color: var(--muted);
				cursor: pointer;
				white-space: nowrap;
				font-family: inherit;
				transition: all 0.15s;
			}
			.filter-row .chip:active {
				background: var(--rose-dim);
				color: var(--rose);
				border-color: var(--rose-dim);
			}
			.filter-row .chip.active {
				background: var(--rose);
				color: #fff;
				border-color: var(--rose);
			}
			.masonry {
				column-count: 2;
				column-gap: 10px;
			}
			.masonry-item {
				break-inside: avoid;
				margin-bottom: 10px;
				border-radius: 10px;
				overflow: hidden;
				position: relative;
				background: var(--surface);
				transition: all 0.15s;
			}
			.masonry-item:active {
				transform: scale(0.97);
			}
			.masonry-item img {
				width: 100%;
				display: block;
				object-fit: cover;
			}
			.masonry-item .overlay {
				position: absolute;
				inset: 0;
				background: linear-gradient(0deg, rgba(13, 8, 10, 0.95) 0%, transparent 50%);
				opacity: 0;
				transition: opacity 0.2s;
				padding: 12px;
				display: flex;
				flex-direction: column;
				justify-content: flex-end;
			}
			.masonry-item:active .overlay {
				opacity: 1;
			}
			.masonry-item .overlay .t {
				font-size: 13px;
				font-weight: 600;
				color: #fff;
			}
			.masonry-item .overlay .a {
				font-size: 10px;
				color: rgba(255, 255, 255, 0.5);
				margin-top: 1px;
			}
			.masonry-item .progress-dot {
				position: absolute;
				top: 8px;
				right: 8px;
				width: 28px;
				height: 28px;
				border-radius: 50%;
				background: rgba(13, 8, 10, 0.7);
				display: flex;
				align-items: center;
				justify-content: center;
				font-size: 9px;
				font-weight: 700;
				color: var(--rose);
				backdrop-filter: blur(4px);
				border: 1px solid rgba(255, 255, 255, 0.04);
			}
			.masonry-item .progress-dot.done {
				color: var(--green, #22c55e);
			}
		</style>
	</head>
	<body>
		<nav>
			<h1>Gallery</h1>
			<div class="actions">
				<button>⊞</button>
				<button>+</button>
			</div>
		</nav>

		<div class="filter-row">
			<span class="chip active">All</span>
			<span class="chip">Fiction</span>
			<span class="chip">Sci-Fi</span>
			<span class="chip">Classics</span>
			<span class="chip">In Progress</span>
			<span class="chip">Finished</span>
		</div>

		<div class="masonry" id="masonry"></div>

		<script>
			const books = [
				{ title: 'The Great Gatsby', author: 'F. Scott Fitzgerald', seed: 'gatsby', pct: 72, h: 1 },
				{ title: '1984', author: 'George Orwell', seed: '1984', pct: 34, h: 1.2 },
				{ title: 'Pride and Prejudice', author: 'Jane Austen', seed: 'pride', pct: 91, h: 1.4 },
				{ title: 'The Hobbit', author: 'J.R.R. Tolkien', seed: 'hobbit', pct: 15, h: 1 },
				{ title: 'Dune', author: 'Frank Herbert', seed: 'dune', pct: 58, h: 1.3 },
				{ title: 'Neuromancer', author: 'William Gibson', seed: 'neuromancer', pct: 7, h: 1 },
				{ title: 'Brave New World', author: 'Aldous Huxley', seed: 'brave', pct: 44, h: 1.1 },
				{ title: 'Fahrenheit 451', author: 'Ray Bradbury', seed: 'fahrenheit', pct: 100, h: 1.4 },
				{
					title: 'The Catcher in the Rye',
					author: 'J.D. Salinger',
					seed: 'catcher',
					pct: 23,
					h: 1.2
				}
			];

			const masonry = document.getElementById('masonry');
			masonry.innerHTML = books
				.map(
					(b) => `
      <div class="masonry-item">
        <img src="https://picsum.photos/seed/${b.seed}/400/${Math.round(560 * b.h)}" alt="${b.title}" style="aspect-ratio:${1}/${b.h}" loading="lazy">
        <div class="progress-dot ${b.pct >= 100 ? 'done' : ''}">${b.pct >= 100 ? '✓' : b.pct + '%'}</div>
        <div class="overlay">
          <div class="t">${b.title}</div>
          <div class="a">${b.author}</div>
        </div>
      </div>
    `
				)
				.join('');
		</script>
	</body>
</html>
