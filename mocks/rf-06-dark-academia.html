<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
		/>
		<title>06 — Dark Academia</title>
		<link
			href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@400;500&display=swap"
			rel="stylesheet"
		/>
		<style>
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}
			:root {
				--bg: #0f0b0a;
				--surface: #16110e;
				--card: #1c1512;
				--text: #d6caba;
				--muted: #85705a;
				--accent: #a08868;
				--accent-dim: rgba(160, 136, 104, 0.08);
				--radius: 0px;
			}
			body {
				font-family: 'Inter', sans-serif;
				font-weight: 450;
				background: var(--bg);
				color: var(--text);
				min-height: 100vh;
			}
			body::before {
				content: '';
				position: fixed;
				inset: 0;
				background: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.015'/%3E%3C/svg%3E");
				pointer-events: none;
			}
			.header {
				display: flex;
				justify-content: space-between;
				align-items: center;
				padding: 28px 24px 0;
				border-bottom: 1px solid #241a15;
				margin: 0 24px;
				padding-bottom: 16px;
			}
			.header h1 {
				font-family: 'Cormorant Garamond', serif;
				font-size: 28px;
				font-weight: 600;
				text-transform: uppercase;
				letter-spacing: 8px;
				color: var(--accent);
			}
			.header button {
				width: 44px;
				height: 44px;
				border: 1px solid #2a1f1a;
				background: transparent;
				color: var(--accent);
				font-size: 20px;
				cursor: pointer;
				font-family: inherit;
				transition: all 0.2s;
			}
			.header button:active {
				background: #1a1210;
				border-color: var(--accent);
			}
			.focus-sec {
				padding: 24px;
				margin: 24px;
				background: var(--surface);
				border: 1px solid #1c1512;
				position: relative;
			}
			.focus-sec::before {
				content: '';
				position: absolute;
				top: 0;
				left: 0;
				right: 0;
				height: 2px;
				background: linear-gradient(90deg, transparent, var(--accent), transparent);
				opacity: 0.2;
			}
			.focus-label {
				font-family: 'Cormorant Garamond', serif;
				font-size: 17px;
				font-style: italic;
				color: var(--accent);
				margin-bottom: 20px;
				letter-spacing: 0.5px;
			}
			.focus-row {
				display: flex;
				gap: 20px;
			}
			.focus-row .cover {
				width: 110px;
				height: 154px;
				object-fit: cover;
				flex-shrink: 0;
				border: 1px solid #241a15;
				filter: sepia(0.15) brightness(0.85);
			}
			.focus-row .info {
				flex: 1;
			}
			.focus-row .info .t {
				font-family: 'Cormorant Garamond', serif;
				font-size: 28px;
				font-weight: 600;
				color: #c8baa8;
				letter-spacing: 0.3px;
			}
			.focus-row .info .a {
				font-size: 15px;
				color: var(--muted);
				margin-top: 4px;
				font-style: italic;
			}
			.focus-row .info .q {
				font-size: 15px;
				color: var(--muted);
				margin-top: 10px;
				font-style: italic;
				line-height: 1.6;
				padding-left: 16px;
				border-left: 2px solid var(--accent-dim);
			}
			.focus-prog {
				margin-top: 16px;
			}
			.focus-prog .row1 {
				display: flex;
				justify-content: space-between;
				font-size: 14px;
				color: var(--muted);
				letter-spacing: 0.5px;
			}
			.focus-prog .row1 strong {
				color: var(--accent);
			}
			.focus-prog .track {
				margin-top: 8px;
				height: 2px;
				background: rgba(255, 255, 255, 0.02);
				overflow: hidden;
			}
			.focus-prog .track .fill {
				height: 100%;
				width: 72%;
				background: var(--accent);
			}
			.focus-btn {
				margin-top: 20px;
				padding: 14px 0;
				width: 100%;
				border: 1px solid #2a1f1a;
				background: transparent;
				color: var(--accent);
				font-size: 16px;
				font-weight: 500;
				cursor: pointer;
				font-family: 'Cormorant Garamond', serif;
				font-style: italic;
				transition: all 0.2s;
				letter-spacing: 1.5px;
			}
			.focus-btn:active {
				background: #1a1210;
				border-color: var(--accent);
			}
			.rest-hdr {
				padding: 0 24px;
				margin-bottom: 16px;
				display: flex;
				justify-content: space-between;
				align-items: center;
			}
			.rest-hdr h2 {
				font-family: 'Cormorant Garamond', serif;
				font-size: 22px;
				font-weight: 400;
			}
			.rest-hdr h2 span {
				color: var(--muted);
			}
			.rest-hdr .sort {
				font-size: 14px;
				color: var(--accent);
				font-style: italic;
			}
			.grid {
				display: grid;
				grid-template-columns: repeat(4, 1fr);
				gap: 12px;
				padding: 0 24px 48px;
			}
			.item {
				text-align: center;
			}
			.item img {
				width: 100%;
				aspect-ratio: 3/4;
				object-fit: cover;
				border: 1px solid #1c1512;
				filter: sepia(0.1) brightness(0.85);
				transition: all 0.2s;
			}
			.item:active img {
				opacity: 0.7;
			}
			.item .t {
				font-size: 13px;
				margin-top: 6px;
				overflow: hidden;
				text-overflow: ellipsis;
				white-space: nowrap;
				color: var(--muted);
				letter-spacing: 0.3px;
			}
			.item .pct {
				display: inline-flex;
				margin-top: 4px;
				width: 26px;
				height: 26px;
				border-radius: 0;
				background: transparent;
				font-size: 12px;
				align-items: center;
				justify-content: center;
				color: var(--accent);
				border: 1px solid #2a1f1a;
			}
		</style>
	</head>
	<body>
		<div class="header">
			<h1>Bibliotheca</h1>
			<button>+</button>
		</div>
		<div class="focus-sec">
			<div class="focus-label">✦ The Current Volume</div>
			<div class="focus-row">
				<img class="cover" src="https://picsum.photos/seed/gatsby/300/420" alt="" loading="lazy" />
				<div class="info">
					<div class="t">The Great Gatsby</div>
					<div class="a">F. Scott Fitzgerald</div>
					<div class="q">"So we beat on, boats against the current..."</div>
				</div>
			</div>
			<div class="focus-prog">
				<div class="row1">
					<span>Chapter VII</span><span><strong>72%</strong> complete</span>
				</div>
				<div class="track"><div class="fill"></div></div>
			</div>
			<button class="focus-btn">Resume Reading</button>
		</div>
		<div class="rest-hdr">
			<h2>The Stacks <span>· 8 more</span></h2>
			<span class="sort">Arrange</span>
		</div>
		<div class="grid" id="g"></div>
		<script>
			const b = [
				{ t: '1984', a: 'George Orwell', s: '1984', p: 34 },
				{ t: 'Pride & Prejudice', a: 'Jane Austen', s: 'pride', p: 91 },
				{ t: 'The Hobbit', a: 'J.R.R. Tolkien', s: 'hobbit', p: 15 },
				{ t: 'Dune', a: 'Frank Herbert', s: 'dune', p: 58 },
				{ t: 'Neuromancer', a: 'W. Gibson', s: 'neuromancer', p: 7 },
				{ t: 'Brave New World', a: 'A. Huxley', s: 'brave', p: 44 },
				{ t: 'Fahrenheit 451', a: 'R. Bradbury', s: 'fahrenheit', p: 100 },
				{ t: 'Catcher in the Rye', a: 'J.D. Salinger', s: 'catcher', p: 23 }
			];
			document.getElementById('g').innerHTML = b
				.map(
					(x) =>
						`<div class="item"><img src="https://picsum.photos/seed/${x.s}/200/280" alt="${x.t}" loading="lazy"><div class="t">${x.t}</div><span class="pct">${x.p}%</span></div>`
				)
				.join('');
		</script>
	</body>
</html>
