<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
		/>
		<title>Mock 6 — Cover Wall</title>
		<link
			href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500&display=swap"
			rel="stylesheet"
		/>
		<style>
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}
			:root {
				--red: #dc2626;
				--bg: #000;
				--surface: #0a0a0a;
				--text: #f0f0f0;
				--muted: #555;
			}
			body {
				font-family: 'Inter', sans-serif;
				background: var(--bg);
				color: var(--text);
				min-height: 100vh;
			}
			.top {
				position: fixed;
				top: 0;
				left: 0;
				right: 0;
				display: flex;
				justify-content: space-between;
				align-items: center;
				padding: 16px 20px;
				background: linear-gradient(180deg, rgba(0, 0, 0, 0.9) 0%, transparent 100%);
				z-index: 10;
			}
			.top h1 {
				font-family: 'Bebas Neue', sans-serif;
				font-size: 28px;
				letter-spacing: 2px;
				color: #fff;
			}
			.top .actions {
				display: flex;
				gap: 12px;
			}
			.top .actions button {
				width: 40px;
				height: 40px;
				border-radius: 50%;
				border: none;
				background: rgba(255, 255, 255, 0.06);
				color: #fff;
				font-size: 18px;
				cursor: pointer;
				backdrop-filter: blur(8px);
				transition: all 0.15s;
			}
			.top .actions button:active {
				background: var(--red);
			}
			.wall {
				display: grid;
				grid-template-columns: repeat(3, 1fr);
				gap: 2px;
				padding-top: 68px;
			}
			.wall-item {
				position: relative;
				overflow: hidden;
				aspect-ratio: 3/4;
				cursor: pointer;
			}
			.wall-item img {
				width: 100%;
				height: 100%;
				object-fit: cover;
				display: block;
				transition: transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
			}
			.wall-item:active img {
				transform: scale(1.08);
			}
			.wall-item .info {
				position: absolute;
				bottom: 0;
				left: 0;
				right: 0;
				padding: 40px 10px 10px;
				background: linear-gradient(0deg, rgba(0, 0, 0, 0.9) 0%, transparent 100%);
				opacity: 0;
				transition: opacity 0.2s;
			}
			.wall-item:active .info {
				opacity: 1;
			}
			.wall-item .info .t {
				font-family: 'Bebas Neue', sans-serif;
				font-size: 14px;
				letter-spacing: 1px;
				color: #fff;
			}
			.wall-item .info .a {
				font-size: 10px;
				color: rgba(255, 255, 255, 0.4);
				margin-top: 1px;
				font-weight: 400;
			}
			.wall-item .info .pct-line {
				margin-top: 6px;
				height: 2px;
				background: rgba(255, 255, 255, 0.1);
				border-radius: 1px;
				overflow: hidden;
			}
			.wall-item .info .pct-line .fill {
				height: 100%;
				background: var(--red);
			}
			.wall-item .badge {
				position: absolute;
				top: 8px;
				left: 8px;
				font-family: 'Bebas Neue', sans-serif;
				font-size: 10px;
				letter-spacing: 1px;
				background: var(--red);
				color: #fff;
				padding: 2px 8px;
			}
			.wall-item .check {
				position: absolute;
				top: 8px;
				right: 8px;
				width: 24px;
				height: 24px;
				border-radius: 50%;
				background: rgba(0, 0, 0, 0.5);
				display: flex;
				align-items: center;
				justify-content: center;
				font-size: 12px;
				color: #fff;
				backdrop-filter: blur(4px);
			}
			.bottom-nav {
				position: fixed;
				bottom: 0;
				left: 0;
				right: 0;
				display: flex;
				justify-content: space-around;
				padding: 12px 20px 24px;
				background: linear-gradient(0deg, rgba(0, 0, 0, 0.95) 0%, transparent 100%);
				z-index: 10;
			}
			.bottom-nav span {
				font-size: 10px;
				font-weight: 500;
				color: var(--muted);
				text-transform: uppercase;
				letter-spacing: 1px;
			}
			.bottom-nav span.active {
				color: var(--red);
			}
		</style>
	</head>
	<body>
		<div class="top">
			<h1>COVERS</h1>
			<div class="actions">
				<button>⊞</button>
				<button>+</button>
			</div>
		</div>

		<div class="wall" id="wall"></div>

		<div class="bottom-nav">
			<span class="active">Library</span>
			<span>Browse</span>
			<span>Reading</span>
			<span>Profile</span>
		</div>

		<script>
			const books = [
				{
					title: 'The Great Gatsby',
					author: 'F. Scott Fitzgerald',
					seed: 'gatsby',
					pct: 72,
					badge: 'Staff Pick'
				},
				{ title: '1984', author: 'George Orwell', seed: '1984', pct: 34 },
				{ title: 'Pride and Prejudice', author: 'Jane Austen', seed: 'pride', pct: 91 },
				{ title: 'The Hobbit', author: 'J.R.R. Tolkien', seed: 'hobbit', pct: 15 },
				{ title: 'Dune', author: 'Frank Herbert', seed: 'dune', pct: 58, badge: 'Trending' },
				{ title: 'Neuromancer', author: 'William Gibson', seed: 'neuromancer', pct: 7 },
				{ title: 'Brave New World', author: 'Aldous Huxley', seed: 'brave', pct: 44 },
				{ title: 'Fahrenheit 451', author: 'Ray Bradbury', seed: 'fahrenheit', pct: 100 },
				{ title: 'The Catcher in the Rye', author: 'J.D. Salinger', seed: 'catcher', pct: 23 }
			];

			const wall = document.getElementById('wall');
			wall.innerHTML = books
				.map(
					(b) => `
      <div class="wall-item">
        <img src="https://picsum.photos/seed/${b.seed}/400/560" alt="${b.title}" loading="lazy">
        ${b.badge ? `<span class="badge">${b.badge}</span>` : ''}
        <span class="check">${b.pct >= 100 ? '✓' : b.pct + '%'}</span>
        <div class="info">
          <div class="t">${b.title}</div>
          <div class="a">${b.author}</div>
          <div class="pct-line"><div class="fill" style="width:${b.pct}%"></div></div>
        </div>
      </div>
    `
				)
				.join('');
		</script>
	</body>
</html>
