<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
		/>
		<title>Mock 7 — Dashboard Stats</title>
		<link
			href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap"
			rel="stylesheet"
		/>
		<style>
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}
			:root {
				--cyan: #06b6d4;
				--cyan-dim: rgba(6, 182, 212, 0.06);
				--bg: #060a0e;
				--surface: #0c1218;
				--card: #111a22;
				--text: #c4d4dc;
				--muted: #3d5a6e;
			}
			body {
				font-family: 'Space Mono', monospace;
				background: var(--bg);
				color: var(--text);
				min-height: 100vh;
				padding: 20px 16px;
			}
			body::before {
				content: '';
				position: fixed;
				inset: 0;
				background: repeating-linear-gradient(
					45deg,
					transparent,
					transparent 40px,
					rgba(6, 182, 212, 0.015) 40px,
					rgba(6, 182, 212, 0.015) 41px
				);
				pointer-events: none;
			}
			.header {
				display: flex;
				justify-content: space-between;
				align-items: center;
				margin-bottom: 24px;
			}
			.header h1 {
				font-size: 16px;
				font-weight: 700;
				text-transform: uppercase;
				letter-spacing: 1px;
				color: var(--cyan);
			}
			.header .badge {
				font-size: 9px;
				text-transform: uppercase;
				letter-spacing: 1px;
				color: var(--muted);
				border: 1px solid var(--surface);
				padding: 4px 10px;
			}
			.stats-grid {
				display: grid;
				grid-template-columns: 1fr 1fr;
				gap: 8px;
				margin-bottom: 24px;
			}
			.stat-block {
				background: var(--surface);
				border: 1px solid rgba(255, 255, 255, 0.02);
				padding: 14px;
			}
			.stat-block .label {
				font-size: 8px;
				text-transform: uppercase;
				letter-spacing: 2px;
				color: var(--muted);
			}
			.stat-block .value {
				font-size: 28px;
				font-weight: 700;
				color: var(--cyan);
				margin-top: 4px;
				line-height: 1;
			}
			.stat-block .value .unit {
				font-size: 12px;
				color: var(--muted);
				font-weight: 400;
			}
			.stat-block.full {
				grid-column: 1 / -1;
			}
			.stat-block .mini-chart {
				display: flex;
				gap: 3px;
				align-items: flex-end;
				margin-top: 8px;
				height: 24px;
			}
			.stat-block .mini-chart .bar {
				flex: 1;
				background: var(--cyan-dim);
				border-radius: 1px;
				min-height: 4px;
			}
			.stat-block .mini-chart .bar.filled {
				background: var(--cyan);
			}
			.section-header {
				display: flex;
				justify-content: space-between;
				align-items: center;
				margin-bottom: 12px;
				padding: 0 2px;
			}
			.section-header h2 {
				font-size: 11px;
				font-weight: 400;
				text-transform: uppercase;
				letter-spacing: 2px;
				color: var(--muted);
			}
			.section-header .count {
				font-size: 11px;
				color: var(--cyan);
			}
			.book-list {
				display: flex;
				flex-direction: column;
				gap: 6px;
			}
			.book-row {
				display: flex;
				align-items: center;
				gap: 10px;
				background: var(--surface);
				padding: 8px 10px;
				border: 1px solid rgba(255, 255, 255, 0.02);
				transition: all 0.15s;
			}
			.book-row:active {
				border-color: var(--cyan-dim);
			}
			.book-row .pos {
				font-size: 11px;
				color: var(--muted);
				width: 16px;
				text-align: right;
			}
			.book-row .cover {
				width: 32px;
				height: 44px;
				object-fit: cover;
				border-radius: 2px;
				flex-shrink: 0;
			}
			.book-row .info {
				flex: 1;
				min-width: 0;
			}
			.book-row .info .t {
				font-size: 11px;
				font-weight: 700;
				overflow: hidden;
				text-overflow: ellipsis;
				white-space: nowrap;
			}
			.book-row .info .a {
				font-size: 9px;
				color: var(--muted);
			}
			.book-row .pct {
				font-size: 11px;
				font-weight: 700;
				color: var(--cyan);
			}
			.book-row .bar {
				width: 40px;
				height: 3px;
				background: rgba(255, 255, 255, 0.04);
				border-radius: 2px;
				overflow: hidden;
			}
			.book-row .bar .fill {
				height: 100%;
				background: var(--cyan);
			}
			.book-row .bar .fill.done {
				background: var(--muted);
			}
		</style>
	</head>
	<body>
		<div class="header">
			<h1>Library/Stat</h1>
			<span class="badge">v2.4.1</span>
		</div>

		<div class="stats-grid">
			<div class="stat-block">
				<div class="label">Books</div>
				<div class="value">9</div>
			</div>
			<div class="stat-block">
				<div class="label">Finished</div>
				<div class="value">1 <span class="unit">/9</span></div>
			</div>
			<div class="stat-block">
				<div class="label">Pages Read</div>
				<div class="value">2,847</div>
			</div>
			<div class="stat-block">
				<div class="label">Reading Streak</div>
				<div class="value">12 <span class="unit">days</span></div>
			</div>
			<div class="stat-block full">
				<div class="label">Activity (this week)</div>
				<div class="mini-chart">
					<div class="bar filled" style="height: 60%"></div>
					<div class="bar filled" style="height: 40%"></div>
					<div class="bar filled" style="height: 80%"></div>
					<div class="bar filled" style="height: 55%"></div>
					<div class="bar" style="height: 20%"></div>
					<div class="bar filled" style="height: 90%"></div>
					<div class="bar" style="height: 10%"></div>
				</div>
			</div>
		</div>

		<div class="section-header">
			<h2>All Titles</h2>
			<span class="count">9 items</span>
		</div>
		<div class="book-list" id="list"></div>

		<script>
			const books = [
				{ title: 'The Great Gatsby', author: 'F. Scott Fitzgerald', seed: 'gatsby', pct: 72 },
				{ title: '1984', author: 'George Orwell', seed: '1984', pct: 34 },
				{ title: 'Pride and Prejudice', author: 'Jane Austen', seed: 'pride', pct: 91 },
				{ title: 'The Hobbit', author: 'J.R.R. Tolkien', seed: 'hobbit', pct: 15 },
				{ title: 'Dune', author: 'Frank Herbert', seed: 'dune', pct: 58 },
				{ title: 'Neuromancer', author: 'William Gibson', seed: 'neuromancer', pct: 7 },
				{ title: 'Brave New World', author: 'Aldous Huxley', seed: 'brave', pct: 44 },
				{ title: 'Fahrenheit 451', author: 'Ray Bradbury', seed: 'fahrenheit', pct: 100 },
				{ title: 'The Catcher in the Rye', author: 'J.D. Salinger', seed: 'catcher', pct: 23 }
			];

			const sorted = [...books].sort((a, b) => b.pct - a.pct);
			document.getElementById('list').innerHTML = sorted
				.map(
					(b, i) => `
      <div class="book-row">
        <span class="pos">${String(i + 1).padStart(2, '0')}</span>
        <img class="cover" src="https://picsum.photos/seed/${b.seed}/200/280" alt="${b.title}" loading="lazy">
        <div class="info">
          <div class="t">${b.title}</div>
          <div class="a">${b.author}</div>
        </div>
        <div class="bar"><div class="fill ${b.pct >= 100 ? 'done' : ''}" style="width:${b.pct}%"></div></div>
        <span class="pct">${b.pct}%</span>
      </div>
    `
				)
				.join('');
		</script>
	</body>
</html>
